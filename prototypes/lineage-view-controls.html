/* ==========================================================================
   11. ACTIONS
   ========================================================================== */
function set(k,v){snap();V[k]=v;dirty();render();}
function uiSet(k,v){UI[k]=v;render();}
function dirty(){UI.savedName="— unsaved —";}
/* Reach, grain, filters and anchor reshape the graph wholesale, so they clear
   the sticky store and re-run the layered layout. Only per-node expansion and
   per-card changes append. */
// minimum is one hop each direction — zero is not offered (Req 8 AC2/AC4)
function bump(k,d){snap();reflow();pinNode(P.anchor);V[k]=Math.max(1,Math.min(9,V[k]+d));if(V.linked){V.up=V[k];V.down=V[k];}dirty();render();}
function setLinked(b){snap();V.linked=b;if(b){const m=Math.max(V.up,V.down);V.up=m;V.down=m;reflow();}render();}
function resetReach(){snap();reflow();V.up=1;V.down=1;V.branch={};dirty();render();}
function setReachPreset(n){snap();reflow();V.up=n;V.down=n;V.branch={};dirty();render();}
function clearBranches(){snap();reflow();V.branch={};dirty();render();}
function expandBranch(id,dir){
  // Never record a branch expansion that cannot change the picture — that made
  // the chip strip claim an expansion while the diagram stayed put.
  if(hiddenNeighbours(id,dir,new Set(LAST.ids))===0) return;
  snap();
  const before=LAST.ids.slice();
  pinNode(id);                       // this card must not move
  V.branch[id]=V.branch[id]||{up:0,down:0};
  // branch depth is additive *from this node* — one click, one level.
  V.branch[id][dir]=(V.branch[id][dir]||0)+1;
  dirty();render();
  LAST_REVEAL=LAST.ids.filter(x=>!before.includes(x));
}
function setGrain(g){snap();reflow();V.grain=g;V.openFields={};V.branch={};dirty();render();}
function setRender(r){snap();V.render=r;render();}
// overlays only change card contents/heights — keep positions, hold the anchor still
function setOverlay(k,b){snap();pinNode(P.anchor);PENDING_FLASH=false;V.overlays[k]=b;dirty();render();}
/* Each language keeps its own annotation set. Switching swaps the active set
   with the stored one, so the technical view stays lean and the business view
   stays rich, and flipping between them is lossless. */
function setLang(l){
  if(l===V.lang) return;
  snap();
  const outgoing=V.overlays;
  V.overlays=V.ovOther;
  V.ovOther=outgoing;
  V.lang=l;
  dirty();render();
}
function setBizLayer(b){setLang(b?"business":"technical");}   // back-compat for the chip strip
function setAnchor(id){
  snap();reflow();
  if(V.grain==="Datasource"){ const m=P.nodes[id]; if(m&&m.members) id=m.members[0]; }
  V.anchor=id;V.branch={};V.pinned=[];V.render="graph";V.panX=0;V.panY=0;dirty();render();
}
function toggleFields(id){snap();pinNode(id);PENDING_FLASH=false;
  if(V.openFields[id])delete V.openFields[id];else V.openFields[id]=1;render();}
function setSearchMode(m){snap();V.searchMode=m;render();}
function onQuery(q){
  V.query=q;
  // if the match exists in the graph but not in scope, pull it in
  V.pinned=[];
  if(q&&q.length>2){
    project();
    const {ids}=traverse();
    const inScope=new Set(ids);
    const hitOutside=Object.keys(P.nodes).find(id=>!inScope.has(id)&&id.toUpperCase().includes(q.toUpperCase()));
    if(hitOutside) V.pinned=pathToAnchor(hitOutside);
  }
  render();
  const el=document.getElementById("q"); if(el){el.focus();try{el.setSelectionRange(q.length,q.length);}catch(e){}}
}
function clearPinned(){V.pinned=[];render();}
function addFilter(k){
  const op=document.getElementById("nfop").value, v=document.getElementById("nfval").value;
  snap();reflow();V.filters.push({k,op,v});UI.addFilter=false;dirty();render();
}
function rmFilter(i){snap();reflow();V.filters.splice(i,1);dirty();render();}
function sortBy(k){V.sort = V.sort.k===k?{k,dir:-V.sort.dir}:{k,dir:1};render();}
/* ---- The four canvas buttons, corrected to match the shipped product.
   Previously ⌂ did a full view reset, and ⇕/✕ acted on graph reach — but in the
   product ⌂ is camera-only and ⇕/✕ expand and collapse each card's FIELD list.
   The reach presets (Req 9) are separate, and live with the reach control. ---- */

// ⌂ — camera only: recentre and zoom on the anchor. No scope change. (Req 9 AC6)
function centerHome(){
  const p=LAST.pos[P.anchor]; if(!p){render();return;}
  V.zoom=DEFAULT_ZOOM; centreOn(p.x+CARDW/2,p.y+p.h/2); render();
}
// ⇕ — expand every visible card to show its fields
/* One button for both: it shows Expand until every visible card is open. */
function allFieldsOpen(){
  const ids=(LAST.ids||[]).filter(id=>P.nodes[id]);
  return ids.length>0&&ids.every(id=>V.openFields[id]);
}
function expandAllFields(){
  snap();pinNode(P.anchor);PENDING_FLASH=false;
  if(V.grain!=="Datasource") LAST.ids.forEach(id=>V.openFields[id]=1);
  render();
}
// ✕ — collapse every card's field list
function collapseAllFields(){
  snap();pinNode(P.anchor);PENDING_FLASH=false;V.openFields={};render();
}

/* ---- Reach presets (Req 9). Two actions, both on the reach control. ---- */
function reachAll(){snap();reflow();V.up=9;V.down=9;dirty();render();fit();}
function resetReachDefault(){
  snap();reflow();
  V.up=1;V.down=1;V.branch={};V.nodePos={};V.zoom=DEFAULT_ZOOM;V.panX=0;V.panY=0;
  dirty();render();
}
// used when navigating away and back, and by the shell's placeholder pages
function goAnchor(){V.query="";V.pinned=[];V.openFields={};resetReachDefault();}
function resetView(){snap();const keep=V.anchor;V=JSON.parse(JSON.stringify(DEFAULTS));V.anchor=keep;dirty();render();}
/* Tidy: throw away both the sticky positions and any hand placement, and let
   the layered layout run clean. The escape hatch for a picture gone messy. */
function tidy(){snap();reflow();V.nodePos={};pinNode(P.anchor);PENDING_FLASH=false;render();}
function zoomBy(d){
  const r=visibleRect(), cx=r.x+r.w/2, cy=r.y+r.h/2;
  V.zoom=Math.max(.25,Math.min(1.6,+(V.zoom+d).toFixed(2)));
  centreOn(cx,cy);   // zoom about the centre of what you were looking at
  render();
}
function fit(){
  if(!LAST.cw) {render();}
  const {w,h}=viewportSize();
  // floor is low on purpose — at 199 nodes "fit" has to actually fit, even
  // though nothing is legible there. That illegibility is the point.
  V.zoom=Math.max(.1,Math.min(DEFAULT_ZOOM,Math.min((w-40)/LAST.cw,(h-40)/LAST.ch)));
  centreOn(LAST.cw/2,LAST.ch/2);
  render();
}
function toggleFS(){UI.fs=!UI.fs;render();}
function togglePanelMode(){
  UI.panelMode = UI.panelMode==="docked"?"float":"docked";
  if(UI.panelMode==="float"&&UI.panelPos.x==null){UI.panelPos={x:window.innerWidth-340,y:150};}
  render();
}
function quickSaveView(){
  const name=prompt("Name this view", UI.savedName||"");
  if(!name) return;
  const el=document.createElement("input"); el.id="savename"; el.value=name; el.style.display="none"; document.body.appendChild(el);
  doSave(); el.remove();
}
function doSave(){
  const nm=(document.getElementById("savename").value||"").trim()||("View "+(SAVED.length+1));
  SAVED.push({name:nm,state:{anchor:V.anchor,up:V.up,down:V.down,grain:V.grain,
    filters:JSON.parse(JSON.stringify(V.filters)),overlays:JSON.parse(JSON.stringify(V.overlays)),
    branch:JSON.parse(JSON.stringify(V.branch))}});
  UI.savedName=nm;UI.showSave=false;render();
}
function loadSaved(i){
  if(i==="")return;
  const s=SAVED[+i];if(!s)return;
  snap();
  Object.assign(V,JSON.parse(JSON.stringify(s.state)));
  V.openFields={};V.query="";V.pinned=[];V.branch=s.state.branch||{};
  reflow();V.nodePos={};V.panX=0;V.panY=0;V.zoom=DEFAULT_ZOOM;
  V.lang=s.state.lang||"technical";
  V.ovOther={...(V.lang==="business"?OV_TECHNICAL:OV_BUSINESS)};
  UI.savedName=s.name;render();
}

/* context menu */
function openCtx(e,id){
  e.stopPropagation();
  const m=document.getElementById("ctx");
  const isDS=V.grain!=="Datasource";
  const vis=new Set(LAST.ids);
  const hu=hiddenNeighbours(id,"up",vis), hd=hiddenNeighbours(id,"down",vis);
  // Req 3 AC4: no hidden neighbours in a direction means no action at all.
  // (Was a disabled row reading "— nothing hidden"; the absent indicator on the
  // card is the signal, per Req 2 AC2, so a greyed row is redundant.)
  const item=(dir,n,label)=> n
    ? `<div onclick="expandBranch('${id}','${dir}');closeCtx()">${label} <span class="cn">+${n}</span></div>`
    : ``;
  // with no expand rows at all, two separators would collide
  const expandRows=item("up",hu,"Expand one level upstream")+item("down",hd,"Expand one level downstream");
  m.innerHTML=`<div class="hd">${P.nodes[id]?(P.nodes[id].name||id):id}</div>
    <div onclick="setAnchor('${id}');closeCtx()">Set as anchor</div>
    ${isDS?`<div onclick="toggleFields('${id}');closeCtx()">${V.openFields[id]?"Hide":"Show"} fields</div>`:""}

/* One shared tooltip. First hover waits a beat; moving along the toolbar
   while one is showing switches instantly, the way Figma's does. No tooltip
   for a tool whose popover is already open — the popover names itself. */
/* Accordion hit-testing. The open slice is chosen from where the pointer sits
   on the strip as it was laid out CLOSED, not from what is under the pointer
   now. Otherwise opening one slice slides the next one under the cursor, it
   opens, the first closes, and the strip flickers back and forth. */
const STRIP_MAP=new WeakMap();
function stripMap(tags){               // closed-layout slice centres, in unscaled card px
  let m=STRIP_MAP.get(tags); if(m) return m;
  const t=tags.getBoundingClientRect(), z=t.width/tags.offsetWidth||1;
  m=[...tags.querySelectorAll(".dbar")].map(el=>{const r=el.getBoundingClientRect();
    return {el,cx:(r.left+r.width/2-t.left)/z,cy:(r.top+r.height/2-t.top)/z};});
  STRIP_MAP.set(tags,m); return m;
}
function closeStrips(except){
  document.querySelectorAll(".dbar.open").forEach(b=>{ if(!except||!except.contains(b)) b.classList.remove("open"); });
}
document.addEventListener("mousemove",e=>{
  const tags=e.target.closest&&e.target.closest(".ncard .dstrip");
  closeStrips(tags);
  if(!tags) return;
  if(!tags.querySelector(".dbar.open")) STRIP_MAP.delete(tags);   // re-measure while closed
  const m=stripMap(tags); if(!m.length) return;
  const t=tags.getBoundingClientRect(), z=t.width/tags.offsetWidth||1;
  const x=(e.clientX-t.left)/z, y=(e.clientY-t.top)/z;
  // pointer over the quality chip, left of the first slice on its line: nothing opens
  let best=null,bd=1e9;
  m.forEach(b=>{const d=Math.abs(b.cx-x)+Math.abs(b.cy-y)*4; if(d<bd){bd=d;best=b;}});
  if(best===m[0] && x<m[0].cx-5) best=null;
  // in a field row only the bars themselves open, not the name or the score
  if(tags.classList.contains("fld") && (x<m[0].cx-5 || x>m[m.length-1].cx+5)) best=null;
  m.forEach(b=>b.el.classList.toggle("open",b===best));

let tipTimer=null, tipWarmUntil=0, tipFor=null;
function tipEl(){let t=document.getElementById("tip");if(!t){t=document.createElement("div");t.id="tip";t.className="tip";t.setAttribute("role","tooltip");document.body.appendChild(t);}return t;}
function showTip(el){

  const t=tipEl(), d=el.dataset;
  t.innerHTML=`<div class="tn">${d.tip}${d.key?`<span class="tk">${d.key}</span>`:""}</div>${d.sub?`<div class="ts">${d.sub}</div>`:""}`;
  const r=el.getBoundingClientRect(), w=t.offsetWidth, h=t.offsetHeight;
  let x=r.left+r.width/2-w/2; x=Math.max(8,Math.min(window.innerWidth-w-8,x));
  t.style.left=x+"px"; t.style.top=(r.top-h-10)+"px";

function hideTip(){
  clearTimeout(tipTimer); tipTimer=null;
  const t=document.getElementById("tip");
  if(t&&t.classList.contains("show")){t.classList.remove("show");tipWarmUntil=Date.now()+500;}
  tipFor=null;
}
function tipTarget(e){return e.target.closest&&e.target.closest("[data-tip]");}
document.addEventListener("mouseover",e=>{

});

function chromeOf(s){return{section:s.section,topTab:s.topTab||null,subTab:s.subTab||null,moduleTab:s.moduleTab||null};}
function findPageByChrome(s){const t=chromeOf(s);return Object.values(PAGES).find(p=>p.chrome&&p.chrome.section===t.section&&(p.chrome.topTab||null)===t.topTab&&(p.chrome.subTab||null)===t.subTab&&(p.chrome.moduleTab||null)===t.moduleTab);}
function navChrome(sec,tt,st){const s={section:sec,topTab:tt||null,subTab:st||null,moduleTab:null};const m=findPageByChrome(s);state=Object.assign(s,{pageId:m?m.id:null});render();}
function navModuleChrome(sec,mt){const s={section:sec,topTab:null,subTab:null,moduleTab:mt||null};const m=findPageByChrome(s);state=Object.assign(s,{pageId:m?m.id:null});render();}
function navPage(id){const p=PAGES[id];if(p&&p.chrome){state.section=p.chrome.section;state.topTab=p.chrome.topTab||null;state.subTab=p.chrome.subTab||null;state.moduleTab=p.chrome.moduleTab||null;}state.pageId=id;render();}
function navPrimary(l){const t=MODULE_TABS[l];navModuleChrome(l,t?t[0]:null);}
function navConfiguration(){const t=CONFIG_TOP_TABS[0];navChrome("Configuration",t,(SUBTABS_BY_TOPTAB[t]||[])[0]||null);}
function navTopTab(l){navChrome("Configuration",l,(SUBTABS_BY_TOPTAB[l]||[])[0]||null);}
function navSubTab(l){navChrome("Configuration",state.topTab,l);}
function navModuleTab(l){navModuleChrome(state.section,l);}
function navPseudo(l){navModuleChrome(l,null);}
function goHome(){navPage(HOME_ID);}
function navItemHtml(l,i,oc,a){return `<a class="nav-item${a?" active":""}" onclick="${oc}">${ICONS[i]}<span>${l}</span></a>`;}
function renderSidebar(){return `
  <div class="ws-switcher" onclick="navPseudo('Workspace')"><div class="ws-icon">${ICONS.grid}</div>
    <div class="ws-text"><div class="ws-name">Feature Enablement</div><div class="ws-region">US1 (Northern Virginia)</div></div>
    <div style="color:var(--muted-foreground)">${ICONS.chevronDown}</div></div>
  <div class="logo-row" onclick="goHome()"><svg width="92" height="19" viewBox="0 0 92 19"><text x="0" y="15" font-family="DM Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#8017e1">precisely</text></svg></div>
  <div class="nav-scroll">${PRIMARY_NAV.map(([l,i])=>navItemHtml(l,i,`navPrimary('${l}')`,state.section===l)).join("")}
    <div class="nav-group-label">Standalone</div>${navItemHtml("Evolve Cloud","cloud","navPrimary('Evolve Cloud')",state.section==="Evolve Cloud")}</div>
  <div class="sidebar-bottom">
    ${navItemHtml("Configuration","configuration","navConfiguration()",state.section==="Configuration")}
    ${navItemHtml("Help","help","navPseudo('Help')",state.section==="Help")}
    ${navItemHtml("Legal/Privacy","legal","navPseudo('Legal')",state.section==="Legal")}
    <a class="nav-item user" onclick="navPseudo('Account')">${ICONS.user}<span>Mandy Bank</span></a>
    <a class="nav-item">${ICONS.collapse}<span>Collapse sidebar</span></a></div>`;}
function defaultBreadcrumb(){
  if(state.section==="Configuration")return["Home","Configuration",state.topTab,state.subTab].filter(Boolean);
  if(state.moduleTab)return["Home",state.section,state.moduleTab].filter(Boolean);
  return["Home",state.section].filter(Boolean);}
function renderTopbar(page){
  const crumbs=(page&&page.breadcrumb?page.breadcrumb:defaultBreadcrumb()).map((c,i)=>i===0?c:`<span class="sep">›</span>${c}`).join("");
  const isModule=state.section!=="Configuration"&&MODULE_TABS[state.section],hide=page&&page.hideModuleChrome;
  let h=`<div class="breadcrumb">${crumbs}</div>`;
  if(isModule&&hide)h+=`<div class="topbar-inline-search"><input type="text" placeholder="Search assets..."></div>`;
  if(state.section==="Configuration")h+=`<div class="top-tabs">${CONFIG_TOP_TABS.map(t=>`<a class="${t===state.topTab?"active":""}" onclick="navTopTab('${t}')">${t}</a>`).join("")}</div>`;
  else if(isModule&&!hide)h+=`<div class="top-tabs">${MODULE_TABS[state.section].map(t=>`<a class="${t===state.moduleTab?"active":""}" onclick="navModuleTab('${t}')">${t}</a>`).join("")}</div>`;
  return h;}
function renderSecondRow(page){
  const isModule=state.section!=="Configuration"&&MODULE_TABS[state.section],el=document.getElementById("subtabs"),hide=page&&page.hideModuleChrome;
  if(state.section==="Configuration"){const s=SUBTABS_BY_TOPTAB[state.topTab]||[];
    if(!s.length){el.style.display="none";el.innerHTML="";return;}
    el.className="sub-tabs";el.style.display="flex";
    el.innerHTML=s.map(t=>`<a class="${t===state.subTab?"active":""}" onclick="navSubTab('${t}')">${t}</a>`).join("");return;}
  if(isModule&&!hide){el.className="module-search-row";el.style.display="block";
    el.innerHTML=`<div class="lin-search"><input type="text" placeholder="Search assets..."></div>`;return;}
  el.style.display="none";el.innerHTML="";}

const SCROLL_KEEP=["vpanel","lin-canvas-wrap"];
function captureScroll(){const s={};SCROLL_KEEP.forEach(id=>{const e=document.getElementById(id);if(e)s[id]={t:e.scrollTop,l:e.scrollLeft};});
  const m=document.querySelector(".main");if(m)s.__main={t:m.scrollTop};return s;}
function restoreScroll(s){SCROLL_KEEP.forEach(id=>{const e=document.getElementById(id);if(e&&s[id]){e.scrollTop=s[id].t;e.scrollLeft=s[id].l;}});
  const m=document.querySelector(".main");if(m&&s.__main)m.scrollTop=s.__main.t;}

function render(){
  hideTip(); if(HCACHE.size>4000) HCACHE.clear();
  const sc=captureScroll();
  const page=state.pageId?PAGES[state.pageId]:null;
  document.body.classList.toggle("annotate",UI.annotate);
  document.getElementById("sidebar").innerHTML=renderSidebar();
  document.getElementById("topbar").innerHTML=renderTopbar(page);
  renderSecondRow(page);
  document.getElementById("content").innerHTML=page?page.render()
    :`<div class="dis-empty"><p>This part of the Suite isn't mocked up — the focus is <b>${FEATURE_NAME}</b>.</p><button class="btn primary" onclick="goHome()">← Back</button></div>`;
  restoreScroll(sc);
}

/* ==========================================================================
   LOADING INTRO — after The Pudding's "Every Line in Hamilton".
   Every piece of a card (its name, quality chip and detail bars) starts as a
   loose pill in its own colour, scattered and drifting over the canvas while
   lineage "loads". The pills then fly to where they belong, one hop at a time
   outward from the anchor; each card fades up the moment its pills land, and
   the edges draw themselves between cards that have arrived.
   ========================================================================== */
let INTRO_ON=false;
function playIntro(){
  if(V.render!=="graph") return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("lin-canvas"), wrap=document.getElementById("lin-canvas-wrap");
  if(!cv||!cv.animate) return;
  INTRO_ON=true;
  const z=V.zoom, cr=cv.getBoundingClientRect();
  const loc=r=>({x:(r.left-cr.left)/z, y:(r.top-cr.top)/z, w:r.width/z, h:r.height/z});
  const vr=visibleRect();
  const A=document.getElementById("card-"+P.anchor);
  const ax=A?loc(A.getBoundingClientRect()).x:vr.x+vr.w/2;
  const HOP=CARDW+60;                         // roughly one lineage column
  const EASE="cubic-bezier(.2,.75,.25,1)";
  const LOAD=650, FLY=900, STEP=260;          // drift, flight, per-hop stagger
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const land={};                              // card id -> time its pills land

  const layer=document.createElement("div");
  layer.className="intro-layer"; cv.appendChild(layer);

  const cards=[...cv.querySelectorAll(".ncard")];
  cards.forEach(card=>{
    const id=card.id.replace("card-",""), cl=loc(card.getBoundingClientRect());
    const hop=Math.round(Math.abs(cl.x-ax)/HOP);
    const t0=LOAD+hop*STEP+rnd(0,120);
    // the pieces this card is built from
    const parts=[];
    const nm=card.querySelector(".nm,.bterm,.bhead h4,.bname")||card.querySelector("b,strong");
    const nmr=nm?loc(nm.getBoundingClientRect()):{x:cl.x+10,y:cl.y+8,w:90,h:9};
    parts.push({r:{x:nmr.x,y:nmr.y+nmr.h*0.2,w:Math.min(nmr.w,CARDW-30),h:Math.max(6,nmr.h*0.6)},bg:"#e9dcfb",bd:"#c9b0f0"});
    card.querySelectorAll(".tags > .tg, .tags .dbar, .caps .cap").forEach(el=>{
      const cs=getComputedStyle(el);
      parts.push({r:loc(el.getBoundingClientRect()),bg:cs.backgroundColor,bd:cs.getPropertyValue("--bd")||"transparent"});
    });
    let last=0;
    parts.forEach((pt,i)=>{
      const el=document.createElement("span");
      el.className="intro-pill";
      el.style.cssText=`width:${pt.r.w}px;height:${pt.r.h}px;background:${pt.bg};box-shadow:inset 0 0 0 1px ${pt.bd};border-radius:${pt.r.h}px`;
      layer.appendChild(el);
      const sx=rnd(vr.x+20,vr.x+vr.w-60), sy=rnd(vr.y+20,vr.y+vr.h-40);
      const dx=rnd(-18,18), dy=rnd(-14,14);
      const delay=t0+i*35, fly=FLY+rnd(-120,120);
      // appear and drift while "loading"
      el.animate([
        {transform:`translate(${sx}px,${sy}px) scale(.4)`,opacity:0},
        {transform:`translate(${sx+dx*.4}px,${sy+dy*.4}px) scale(1)`,opacity:.95,offset:.25},
        {transform:`translate(${sx+dx}px,${sy+dy}px) scale(1)`,opacity:.95}
      ],{duration:delay,easing:"ease-out",fill:"both",delay:rnd(0,220)});
      // fly home
      el.animate([
        {transform:`translate(${sx+dx}px,${sy+dy}px) scale(1)`,opacity:.95},
        {transform:`translate(${pt.r.x}px,${pt.r.y}px) scale(1)`,opacity:1}
      ],{duration:fly,delay,easing:EASE,fill:"forwards"});
      // hand over to the real card
      el.animate([{opacity:1},{opacity:0}],{duration:220,delay:delay+fly,fill:"forwards"});
      last=Math.max(last,delay+fly);
    });
    land[id]=last;
    card.animate([{opacity:0,transform:"translateY(4px)"},{opacity:1,transform:"none"}],
      {duration:320,delay:last-120,easing:"ease-out",fill:"backwards"});
  });

  // edges draw once both ends have landed; timing taken from where the path sits
  const landAtX=x=>{const hop=Math.round(Math.abs(x-ax)/HOP); return LOAD+hop*STEP+FLY+120;};
  cv.querySelectorAll("#cedges path").forEach(pth=>{
    let b; try{b=pth.getBBox();}catch(e){return;}
    const tA=landAtX(b.x), tB=landAtX(b.x+b.width), start=Math.max(tA,tB);
    if(pth.getAttribute("stroke-dasharray")){
      pth.animate([{opacity:0},{opacity:1}],{duration:300,delay:start,fill:"backwards"});
    }else{
      pth.setAttribute("pathLength","1");
      pth.animate([{strokeDasharray:"1 1",strokeDashoffset:1},{strokeDasharray:"1 1",strokeDashoffset:0}],
        {duration:520,delay:start,easing:EASE,fill:"backwards"}).onfinish=()=>pth.removeAttribute("pathLength");
    }
  });
  cv.querySelectorAll(".elabel,.blabel").forEach(l=>{
    const x=parseFloat(l.style.left)||0;
    l.animate([{opacity:0},{opacity:1}],{duration:300,delay:landAtX(x)+300,fill:"backwards"});
  });

  // a quiet status line while it assembles
  const cap=document.createElement("div");
  cap.className="intro-cap";
  const n=P.nodes[P.anchor];
  cap.innerHTML=`<span class="intro-dots"><i></i><i></i><i></i></span>Tracing lineage for <b>${biz()&&n&&bizTitle(n)?bizTitle(n):P.anchor}</b>`;
  wrap.appendChild(cap);
  const end=Math.max(0,...Object.values(land))+600;
  cap.animate([{opacity:0,transform:"translate(-50%,-4px)"},{opacity:1,transform:"translate(-50%,0)"}],{duration:250,fill:"both"});
  setTimeout(()=>cap.animate([{opacity:1},{opacity:0}],{duration:300,fill:"forwards"}),Math.max(900,LOAD+FLY));
  setTimeout(()=>{layer.remove();cap.remove();INTRO_ON=false;},end);
}
function replayIntro(){UI.pop=null;render();requestAnimationFrame(()=>playIntro());}

seedFromDetails();   // lineage starts from whatever the details page hides
navPage(HOME_ID);
requestAnimationFrame(()=>{ if(document.getElementById("lin-canvas-wrap")) centerHome(); setTimeout(playIntro,60); });
</script>
