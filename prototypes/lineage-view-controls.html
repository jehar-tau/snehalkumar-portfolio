<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lineage Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background:#f2f2f2; --card:#fff; --foreground:#121212; --muted-foreground:#606060;
    --border:#dedede; --primary:#8017e1; --primary-light:#f3e9ff; --primary-dark:#39006b;
    --pink:#e5007e; --orange:#fd7e08; --blue:#001b4c; --radius:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--foreground);background:var(--background);font-size:14px;display:flex;min-height:100vh}
  a{color:inherit;cursor:pointer}

  /* sidebar */
  .sidebar{width:220px;flex:none;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  .ws-switcher{display:flex;align-items:center;gap:8px;padding:14px 14px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
  .ws-icon{width:22px;height:22px;border-radius:5px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;flex:none}
  .ws-text{flex:1;line-height:1.25;overflow:hidden}
  .ws-name{font-weight:700;font-size:12.5px}
  .ws-region{color:var(--muted-foreground);font-size:11px}
  .logo-row{padding:16px 14px 10px;cursor:pointer}
  .nav-scroll{flex:1;overflow-y:auto;padding:4px 10px}
  .nav-group-label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);font-size:13.5px;margin-bottom:2px;text-decoration:none}
  .nav-item svg{flex:none}
  .nav-item:hover{background:#f7f5fb}
  .nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:700}
  .sidebar-bottom{padding:8px 10px 14px;border-top:1px solid var(--border)}
  .sidebar-bottom .nav-item{font-size:13px}
  .sidebar-bottom .nav-item.user{font-weight:600}

  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
  .topbar{padding:16px 32px 0;background:var(--card);border-bottom:1px solid var(--border);position:relative}
  .breadcrumb{color:var(--muted-foreground);font-size:12.5px;margin-bottom:12px}
  .breadcrumb .sep{margin:0 6px}
  .top-tabs{display:flex;gap:24px;flex-wrap:wrap}
  .top-tabs a{padding:0 2px 12px;color:var(--muted-foreground);text-decoration:none;font-size:14px;border-bottom:2px solid transparent}
  .top-tabs a.active{color:var(--foreground);font-weight:700;border-bottom-color:var(--primary)}
  .sub-tabs{display:flex;gap:20px;padding:10px 32px 0;background:var(--card);border-bottom:1px solid var(--border)}
  .sub-tabs a{padding:0 2px 10px;color:var(--muted-foreground);font-size:13px;position:relative}
  .sub-tabs a.active{color:var(--foreground);font-weight:700}
  .sub-tabs a.active::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--primary);transform:translateX(-50%)}
  .content{flex:1;padding:22px 32px 40px}
  .topbar-inline-search{position:absolute;top:16px;right:32px}
  .topbar-inline-search input{font:inherit;padding:7px 12px 7px 30px;border:1px solid var(--border);border-radius:var(--radius);width:220px;font-size:13px}
  .topbar-inline-search::before{content:"⌕";position:absolute;left:10px;top:7px;color:var(--muted-foreground);font-size:13px}
  .module-search-row{padding:14px 32px 0}

  .btn{font:inherit;padding:8px 16px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;background:#fff}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.outline{border-color:var(--border)}
  .btn.ghost{background:none}
  .btn.sm{padding:5px 11px;font-size:12.5px}

  .asset-header{margin-bottom:16px}
  .asset-title-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
  .asset-icon-lg{width:34px;height:34px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;flex:none}
  .asset-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  .asset-subtitle{color:var(--muted-foreground);font-size:13px;margin-top:3px}
  .asset-subtitle a{color:var(--primary);text-decoration:none}
  .score-badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .score-badge.good{background:#dcfce7;color:#15803d}
  .score-badge.bad{background:#fde7f0;color:#b91c1c}
  .status-badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .status-badge.certified{background:#dcfce7;color:#15803d}
  .status-badge.review{background:#ffedd5;color:#b45309}
  .status-badge.pii{background:#fde7f0;color:#a3006b}
  .asset-card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .asset-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .asset-card-top{display:flex;gap:10px;margin-bottom:10px}
  .asset-card-icon{width:34px;height:34px;border-radius:7px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;flex:none}
  .asset-card-name{font-weight:700;font-size:14px}
  .asset-card-type{color:var(--muted-foreground);font-size:12px}
  .asset-card-path{font-size:12px;color:var(--primary);margin-bottom:10px}
  .dis-empty{text-align:center;padding:70px 20px;color:var(--muted-foreground)}
  .dis-empty p{max-width:420px;margin:0 auto 18px;line-height:1.5}

  /* toolbar */
  .lin-toolbar{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
  .lin-search{position:relative;flex:1;min-width:200px}
  .lin-search input{font:inherit;width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
  .lin-search::before{content:"⌕";position:absolute;left:11px;top:8px;color:var(--muted-foreground)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff}
  .seg button{font:inherit;font-size:12.5px;padding:7px 12px;border:none;background:#fff;color:var(--muted-foreground);cursor:pointer;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:none}
  .seg button.active{background:var(--primary);color:#fff;font-weight:600}
  .seg.sm button{padding:4px 9px;font-size:11.5px}
  .pill-btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;padding:8px 15px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;white-space:nowrap}
  .pill-btn.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .pill-btn:disabled{opacity:.4;cursor:default}
  .toolbar-select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
  .switch-lbl{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap;cursor:pointer}
  .sw-track{width:34px;height:18px;border-radius:999px;background:#cfcfd8;position:relative;flex:none;transition:background .15s}
  .sw-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
  input[type=checkbox].sw{display:none}
  input[type=checkbox].sw:checked + .sw-track{background:var(--primary)}
  input[type=checkbox].sw:checked + .sw-track .sw-knob{left:18px}

  /* chip strip */
  /* status, not action — so no purple, and quieter than the controls above it */
  .viewstrip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:transparent;
    border-bottom:1px solid var(--border);padding:0 2px 8px;margin-bottom:10px}
  .vchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1.6;padding:2px 8px;
    border-radius:4px;background:#f4f4f7;color:var(--foreground);border:1px solid #e4e4ec}
  .vchip b{font-weight:600;color:var(--muted-foreground)}
  .vchip .x{cursor:pointer;color:#a8a8b4;font-size:10px;margin-left:1px}
  .vchip .x:hover{color:var(--foreground)}
  .viewstrip .spacer{flex:1}
  .viewstrip .saved{font-size:11px;color:#a0a0ae}
  .viewstrip .saved b{color:var(--muted-foreground);font-weight:600}

  /* canvas */
  .lin-layout{display:grid;gap:14px;align-items:start}
  .lin-layout.docked{grid-template-columns:minmax(0,1fr) 320px}
  .lin-layout.full{grid-template-columns:minmax(0,1fr)}
  .lin-layout>*{min-width:0}
  /* overflow hidden: panning is transform-only, so canvas↔screen is one clean
     mapping and the minimap viewport can be derived from it */
  .canvas-wrap{position:relative;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden;overflow:clip;height:660px;cursor:grab}
  .canvas-wrap.fs{position:fixed;inset:0;z-index:200;height:100vh;border-radius:0}
  .canvas-wrap.panning{cursor:grabbing}
  .canvas{position:relative;transform-origin:0 0;background:#fff}
  .cedges{position:absolute;left:0;top:0;pointer-events:none}

  .ncard{position:absolute;width:172px;background:#fff;border:1px solid #d8d8e0;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.09);cursor:grab}
  .ncard:active{cursor:grabbing}
  /* no distinct treatment for a hand-placed node — the cursor is the affordance
     (Req 6 AC2) and people tend to move a node and move it back */
  .ncard .ft,.ncard .fld,.ncard .nchip,.ncard .nkebab{cursor:pointer}
  .ncard.focus{border:1.5px solid var(--primary);box-shadow:0 2px 10px rgba(128,23,225,.2)}
  .ncard.dim{opacity:.22}
  .ncard.hit{border:1.5px solid var(--orange);box-shadow:0 0 0 3px rgba(253,126,8,.18)}
  .ncard .barhome{height:14px;background:var(--primary);border-radius:5px 5px 0 0;display:grid;place-items:center;color:#fff;font-size:8px}
  .ncard .body{padding:6px 8px 5px}
  .ncard .r1{display:flex;gap:6px;align-items:flex-start}
  .ncard .ico{width:14px;height:14px;border-radius:3px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;font-size:7px;flex:none;margin-top:1px}
  .ncard .nm{font-size:9px;font-weight:700;letter-spacing:.02em;line-height:1.2;text-transform:uppercase;word-break:break-word}
  .ncard .pth{font-size:7px;color:var(--muted-foreground);line-height:1.35;margin-top:1px}
  /* nowrap: four tags is the worst case and it just fits. Wrapping would grow
     this row inside a card whose height the layout already fixed, so clip instead. */
  .ncard .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:nowrap;overflow:hidden}
  .ncard .tg{font-size:7px;padding:1px 5px;border-radius:999px;font-weight:700;line-height:1.5}
  .ncard .tg.dq{background:#dcfce7;color:#15803d}
  .ncard .tg.dq.bad{background:#fde7f0;color:#b91c1c}
  .ncard .tg.gov{background:#e8ebff;color:#3730a3}
  .ncard .tg.gov.low{background:#fdf0dc;color:#9a5b00}
  .ncard .tg.cert{background:#eef1f6;color:#475569}
  .ncard .tg.pii{background:#fde7f0;color:#a3006b}
  .ncard .tg.xf{background:var(--primary-light);color:var(--primary-dark)}
  /* ---- business layer: the acetate sheet. Same boxes, repainted contents. ---- */
  .canvas.biz{background:#e3e3e9}
  .canvas-wrap.biz{background:#e3e3e9}
  .ncard.biz{background:#fff;border-color:#c9c9d6;box-shadow:0 2px 7px rgba(0,0,0,.12)}
  .ncard.biz.focus{background:#fff;border-color:var(--primary);box-shadow:0 3px 14px rgba(128,23,225,.25)}
  .ncard .bhead{padding:5px 8px 3px}
  .ncard .bterm{font-size:12.5px;font-weight:700;color:var(--primary-dark);line-height:1.15;letter-spacing:-.1px;word-break:break-word}
  /* unmapped: the technical name stands in for the missing term, visibly demoted */
  .ncard .bterm.unmapped{font-size:9.5px;font-weight:600;color:#8c8c99;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0}
  .ncard.biz .bterm.unmapped{border-left:2px solid #e2c8a0;padding-left:5px;margin-left:-1px}
  .ncard .ghost{font-size:7px;color:#9a9aa8;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ncard .ghost.gh-un{color:#b08948;font-style:italic;font-family:inherit;opacity:.9}
  /* policy: outlined band, navy — distinct from purple terms and pink PII */
  .ncard .tmore{font-size:8px;font-weight:700;color:var(--primary);margin-left:3px;vertical-align:top}
  .ncard .tcert{font-size:8px;font-weight:700;color:#15803d;margin-left:3px;vertical-align:top}
  .ncard .ovrow .tcert{font-size:7px}
  /* metrics: outlined band like policy, but teal-green and diamond-marked so the
     two kinds of business context are never confused at a glance */
  .ncard .bmet{font-size:7.5px;font-weight:700;color:#0f766e;background:#fff;
    border:1px solid #bfdfd8;border-left:3px solid #0f766e;border-radius:3px;
    padding:1px 5px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ncard .bpol{font-size:7.5px;font-weight:700;color:var(--blue);background:#fff;
    border:1px solid #c3cbe0;border-left:3px solid var(--blue);border-radius:3px;
    padding:1px 5px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
  /* field rows in business mode */
  .ncard .fld.biz .fn.ft-term{font-size:8px;font-weight:700;color:var(--primary-dark)}
  .ncard .fld.biz .fn.ft-un{font-size:7.5px;color:#8c8c99;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ncard .fld .fn-ghost{font-size:6.5px;color:#a8a8b6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
  .ncard .fld.biz.unmapped{background:#fffdf7}
  .ncard .fld .fdq{flex:none}
  .ncard .ov{margin-top:4px;padding-top:4px;border-top:1px dashed #e6dcf5}
  .ncard .ovrow{font-size:7px;line-height:1.5;color:var(--primary-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ncard .ovrow span{color:var(--muted-foreground)}
  .ncard .ft{border-top:1px solid #ececf2;padding:3px 8px;display:flex;align-items:center;justify-content:space-between;font-size:7.5px;color:var(--muted-foreground);cursor:pointer}
  .ncard .ft:hover{background:#faf8fe;color:var(--primary)}
  .ncard .flds{border-top:1px solid #ececf2;padding:2px 0 3px}
  .ncard .fld{display:flex;align-items:center;gap:4px;height:15px;padding:0 8px;font-size:7.5px}
  .ncard .fld .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ncard .fld .fbars{display:flex;gap:3px;flex:none;align-items:center;padding:0 1px}
  .ncard .fld .fgrp{display:flex;gap:1px;flex:none}
  .ncard .fld.dstrip{overflow:hidden}
  /* while a field bar is open, the column name steps aside to give it room */
  .ncard .fld:has(.dbar.open) .fn-ghost{max-width:0;opacity:0}
  .ncard .fld .fn-ghost{transition:max-width .3s cubic-bezier(.2,.75,.25,1),opacity .2s ease}
  .ncard .fld .dslot{flex:none;width:4px}
  .ncard .fld .dbar{flex:none;max-width:4px;width:auto;
    transition:max-width .3s cubic-bezier(.2,.75,.25,1),border-radius .3s ease,box-shadow .2s ease,transform .2s ease}
  .ncard .fld .dbar .dl{flex:none}
  .ncard .fld .dbar.open{flex:none;max-width:124px}
  .ncard .fld .fp{font-size:6.5px;background:#fde7f0;color:#a3006b;padding:0 3px;border-radius:2px;font-weight:700}
  .ncard .fld.lin{background:#faf6ff}

  .nchip{position:absolute;font:inherit;font-size:9px;font-weight:700;padding:2px 5px;border-radius:999px;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;white-space:nowrap;z-index:4}
  .nchip:hover{background:var(--primary);color:#fff}
  .nkebab{position:absolute;right:2px;top:2px;width:15px;height:15px;border-radius:3px;border:1px solid transparent;background:rgba(255,255,255,.8);color:var(--muted-foreground);font-size:10px;line-height:13px;text-align:center;cursor:pointer;z-index:5}
  .nkebab:hover{border-color:var(--primary);color:var(--primary)}
  .elabel{position:absolute;font-size:7.5px;background:#fff;border:1px solid #e6e6ee;border-radius:3px;padding:0 3px;color:var(--muted-foreground);z-index:2;white-space:nowrap}
  .blabel{position:absolute;font-size:7.5px;background:#fff8ec;border:1px solid #f0dcbc;border-radius:3px;padding:0 3px;color:#8a4b00;z-index:2;font-weight:600;white-space:nowrap}

  .zoombox{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;z-index:20}
  .zoombox button{font:inherit;width:27px;height:24px;border:none;border-bottom:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px}
  .zoombox button:last-child{border-bottom:none}
  .roundset{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:20}
  .roundset button{width:29px;height:29px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px}
  .roundset button:hover{border-color:var(--primary);color:var(--primary)}
  .canvas-stat{position:absolute;left:14px;top:12px;font-size:11px;color:var(--muted-foreground);background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:6px;padding:4px 9px;z-index:20}
  .canvas-stat b{color:var(--foreground)}
  .canvas-stat .statlink{color:var(--primary);font-weight:700;cursor:pointer;margin-left:4px}
  .canvas-stat .statlink:hover{text-decoration:underline}

  /* newly revealed cards ring once */
  @keyframes justadded{
    0%{box-shadow:0 0 0 0 rgba(253,126,8,.85),0 1px 4px rgba(0,0,0,.09)}
    35%{box-shadow:0 0 0 5px rgba(253,126,8,.42),0 1px 4px rgba(0,0,0,.09)}
    100%{box-shadow:0 0 0 12px rgba(253,126,8,0),0 1px 4px rgba(0,0,0,.09)}
  }
  .ncard.justadded{animation:justadded 1.5s ease-out 1;border-color:var(--orange)}

  /* minimap */
  .minimap{position:absolute;right:14px;bottom:16px;width:180px;height:124px;padding:6px;
    background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:7px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);z-index:22;cursor:crosshair;overflow:hidden}
  .minimap .mm-inner{position:relative}
  .minimap i{position:absolute;background:#c7c7d4;border-radius:1px}
  .minimap i.mm-a{background:var(--primary)}
  .minimap i.mm-m{background:#b98cea}
  .minimap .mm-vp{position:absolute;border:1.5px solid var(--primary);background:rgba(128,23,225,.09);border-radius:2px;pointer-events:none}
  .minimap .mm-label{position:absolute;right:6px;bottom:3px;font-size:9px;color:var(--muted-foreground);background:rgba(255,255,255,.85);padding:0 3px;border-radius:2px}
  .canvas-wrap.biz .minimap{background:rgba(255,255,255,.97)}

  .ctxmenu{position:fixed;z-index:300;background:#fff;border:1px solid var(--border);border-radius:7px;box-shadow:0 8px 26px rgba(0,0,0,.16);padding:5px;width:224px;display:none}
  .ctxmenu.open{display:block}
  .ctxmenu div{padding:6px 9px;font-size:12.5px;border-radius:5px;cursor:pointer}
  .ctxmenu div:hover{background:var(--primary-light);color:var(--primary-dark)}
  .ctxmenu .hd{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);padding:4px 9px 6px;cursor:default;font-weight:700}
  .ctxmenu .hd:hover{background:none;color:var(--muted-foreground)}
  .ctxmenu .sep{height:1px;background:var(--border);margin:4px 2px;padding:0}
  .ctxmenu .sep:hover{background:var(--border)}
  .ctxmenu div.dis{opacity:.42;cursor:default}
  .ctxmenu div.dis:hover{background:none;color:inherit}
  .ctxmenu .cn{color:var(--primary);font-weight:700}
  .ctxmenu div.dis .cn{color:var(--muted-foreground);font-weight:400;font-size:11.5px}

  /* display panel — named to match the shipped Display control, and to leave
     "view" to mean the saved view state rather than the control surface */
  .vpanel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.05);max-height:660px;overflow-y:auto;min-width:0}
  .vpanel.float{position:fixed;width:302px;z-index:150;box-shadow:0 14px 40px rgba(0,0,0,.2);max-height:78vh}
  .vp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2}
  .vp-head h3{margin:0;font-size:14px;font-weight:700;flex:1}

  .vp-head .ic{cursor:pointer;color:var(--muted-foreground);font-size:13px;padding:0 2px}
  .vp-head .ic:hover{color:var(--primary)}
  .vpanel.float .vp-head{cursor:grab}
  .vpanel.dragging .vp-head{cursor:grabbing}
  .vsec{border-bottom:1px solid var(--border);padding:11px 13px}
  .vsec:last-of-type{border-bottom:none}
   .vp-group-label{padding:10px 13px 5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);font-weight:700;background:#fafafb;border-bottom:1px solid #eee}
   .mode-note{font-size:11px;color:var(--muted-foreground);margin-top:6px;line-height:1.4}
   .toolbar-view-select{max-width:180px}
   .toolbar-label{font-size:11px;color:var(--muted-foreground);font-weight:600}
  .vsec>h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
  .vsec>h4 .cnt{background:var(--primary-light);color:var(--primary);border-radius:999px;padding:0 5px;font-size:9.5px}
  /* Req 6 — collapsible sections. The count stays visible when collapsed (AC3). */
  .vsec>h4.sechead{cursor:pointer;user-select:none;margin-bottom:0}
  .vsec>h4.sechead:hover{color:var(--foreground)}
  .vsec>h4.sechead+*{margin-top:9px}
  .vsec .caret{display:inline-block;width:10px;color:var(--muted-foreground);font-size:11px}
  .vsec .hint{font-size:11px;color:var(--muted-foreground);line-height:1.45;margin-top:7px}
  .vsec .hint b{color:var(--foreground);font-weight:600}
  .anchor-row{display:flex;align-items:center;gap:8px}
  .anchor-row .ic2{width:24px;height:24px;border-radius:5px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;font-size:11px;flex:none}
  .anchor-row .nm{font-size:12.5px;font-weight:700;line-height:1.2;word-break:break-all}
  .anchor-row .ty{font-size:10.5px;color:var(--muted-foreground)}
  .reach-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .reach-row .rl{font-size:12.5px;flex:1}
  .reach-presets{display:flex;gap:6px;margin-top:9px}
  .reach-presets .btn{flex:1;font-size:11.5px;padding:5px 6px}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .stepper button{font:inherit;width:24px;height:24px;border:none;background:#fff;cursor:pointer}
  .stepper button:hover{background:var(--primary-light);color:var(--primary)}
  .stepper span{min-width:32px;text-align:center;font-size:12.5px;font-weight:700;border-left:1px solid var(--border);border-right:1px solid var(--border);height:24px;line-height:24px}
  .radios label,.checks label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;cursor:pointer}
  .radios label.off{opacity:.5;cursor:default}
  .checks .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);margin:8px 0 2px;font-weight:700}
  .checks .grp:first-child{margin-top:0}
  .checks .grp.sub{margin-top:7px;font-size:9.5px;color:#8a8a96}
  .checks .nest{padding-left:9px;border-left:2px solid #efeaf7;margin-left:1px}
  .checks .inherit{font-size:10.5px;color:var(--muted-foreground);margin:0 0 5px;padding:3px 7px;
    background:#f5f7fa;border-radius:4px;border-left:2px solid #cfd6e0}
  .checks .inherit.diff{background:#fff8ec;border-left-color:var(--orange);color:#8a5b00}
  .checks .inherit a{color:var(--primary);font-weight:700;cursor:pointer}
  .bizhint{font-size:11px;color:var(--muted-foreground);line-height:1.45;margin:6px 0 12px}
  .vsec .sublabel{font-size:11px;font-weight:700;color:var(--foreground);margin:0 0 6px}
  .vsec .sublabel .dimnote{font-weight:400;color:var(--muted-foreground)}
  .checks .dimnote{color:var(--muted-foreground);font-size:11px}
  .seg.langseg button{padding:8px 12px;font-size:13px}
  .checks label.locked{color:var(--muted-foreground);cursor:default;padding:4px 0}
  .checks label.locked .lockic{color:var(--primary);font-size:10px;width:13px;text-align:center}
  .filt-row{display:flex;align-items:center;gap:6px;background:#f7f6fb;border:1px solid #eceaf4;border-radius:6px;padding:5px 8px;margin-bottom:6px;font-size:11.5px}
  .filt-row .fk{font-weight:700;white-space:nowrap}
  .filt-row .fv{color:var(--primary-dark);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filt-row .x{cursor:pointer;color:var(--muted-foreground)}
  .addfilt{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
  .addbox{border:1px solid var(--border);border-radius:6px;padding:8px;margin-top:7px;background:#fbfaff}
  .addbox select,.addbox input{font:inherit;font-size:12px;width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:5px;margin-bottom:6px;background:#fff}
  .vp-foot{padding:11px 13px;display:flex;gap:8px;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border)}
  .vp-foot .btn{flex:1;font-size:12.5px;padding:7px 10px}
  .savedsel{width:100%;font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;margin-bottom:7px}

  /* list */
  .ltable-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:auto;height:660px}
  .ltable{width:100%;border-collapse:collapse;font-size:12.5px}
  .ltable th{text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);background:#fafafb;position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
  .ltable th:hover{color:var(--primary)}
  .ltable td{padding:7px 12px;border-bottom:1px solid #eee;white-space:nowrap}
  .ltable tr:hover td{background:#faf9fe}
  .ltable .up{color:#b45309;font-weight:600}
  .ltable .dn{color:#1d4ed8;font-weight:600}
  .ltable .an{color:var(--primary);font-weight:700}
  .ltable .nmc{font-weight:700;cursor:pointer}
  .ltable .nmc:hover{color:var(--primary)}

  /* annotate */
  body.annotate [data-req]{position:relative;outline:1.5px dashed rgba(128,23,225,.55);outline-offset:2px;border-radius:4px}
  body.annotate [data-req]::after{content:attr(data-req);position:absolute;top:-9px;right:-10px;background:var(--primary);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:999px;z-index:25;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}

  .proto-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fffbe8;border:1px solid #f5e6a8;border-radius:var(--radius);padding:9px 14px;font-size:12.5px;color:#6b5700}
  .proto-bar b{color:#4a3c00}
  .proto-bar .spacer{flex:1}
  .proto-bar label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}

  .cov{margin-top:16px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}
  .cov>summary{padding:13px 18px;font-weight:700;cursor:pointer;font-size:14px}
  .cov table{width:100%;border-collapse:collapse;font-size:12.5px}
  .cov th{text-align:left;padding:9px 18px;background:#fafafb;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-weight:600}
  .cov td{padding:8px 18px;border-bottom:1px solid #eee;vertical-align:top;line-height:1.45}
  .cov .n{font-weight:700;color:var(--primary);width:52px}
  .cov .ly{color:var(--muted-foreground);white-space:nowrap}
  .cov .rn{font-weight:700;color:var(--foreground);white-space:nowrap}
  @media (max-width:1250px){.lin-layout.docked{grid-template-columns:1fr}.asset-card-grid{grid-template-columns:repeat(2,1fr)}}

  /* ===== Bottom display toolbar (Figma-style) =====
     Replaces the docked Display panel. Each former panel section is one tool;
     its controls open in a popover above the toolbar, one at a time. */
  .dtb{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;
    display:flex;align-items:center;gap:4px;padding:6px;background:#fff;border-radius:16px;
    border:1px solid #e7e7ec;box-shadow:0 6px 24px rgba(20,16,40,.14),0 1px 3px rgba(20,16,40,.08);
    cursor:default;user-select:none;white-space:nowrap}
  .dtb-grp{display:flex;align-items:center;gap:2px}
  .dtb-sep{width:1px;align-self:stretch;background:#ececf1;margin:2px 6px}
  .dtb-tool{position:relative}
  .dtb-btn{display:inline-flex;align-items:center;gap:3px;height:40px;min-width:40px;padding:0 7px;
    border:none;background:transparent;border-radius:10px;color:#1f1f24;cursor:pointer;font:inherit;position:relative}
  .dtb-btn:hover{background:#f2f2f6}
  .dtb-btn:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .dtb-btn svg{flex:none}
  .dtb-btn .chev{color:#6b6b76;margin-left:1px}
  .dtb-btn .val{font-size:11.5px;font-weight:600;color:var(--muted-foreground);margin-left:2px}
  .dtb-btn .badge{position:absolute;top:4px;left:22px;min-width:15px;height:15px;padding:0 4px;border-radius:999px;
    background:var(--primary);color:#fff;font-size:9.5px;font-weight:700;line-height:15px;text-align:center;box-shadow:0 0 0 2px #fff}
  .dtb-btn.dot::after{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
  .dtb-tool.open>.dtb-btn{background:var(--primary);color:#fff}
  .dtb-tool.open>.dtb-btn .chev,.dtb-tool.open>.dtb-btn .val{color:#fff}
  .dtb-tool.open>.dtb-btn .badge{background:#fff;color:var(--primary);box-shadow:none}
  .dtb-zoom{font-size:12.5px;font-weight:600;padding:0 8px 0 10px}
  .dtb-mode{display:flex;gap:2px;background:#f1f1f4;border-radius:11px;padding:3px}
  .dtb-mode button{width:40px;height:34px;border:none;border-radius:8px;background:transparent;color:#707080;cursor:pointer;display:grid;place-items:center}
  .dtb-mode button:hover{color:var(--foreground)}
  .dtb-mode button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  .dtb-pop{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);width:292px;
    background:#fff;border:1px solid #e7e7ec;border-radius:12px;box-shadow:0 14px 40px rgba(20,16,40,.18);
    max-height:min(470px,calc(100vh - 200px));overflow-y:auto;white-space:normal;text-align:left;cursor:default}
  .dtb-pop.menu{width:220px;padding:5px}
  .dtb-pop .ph{display:flex;align-items:baseline;gap:8px;padding:12px 14px 4px}
  .dtb-pop .ph h4{margin:0;font-size:13.5px;font-weight:700;flex:1}
  .dtb-pop .ph .reset{font-size:11.5px;color:var(--primary);font-weight:600;cursor:pointer}
  .dtb-pop .pb{padding:6px 14px 14px}
  .dtb-pop .pb .hint{font-size:11px;color:var(--muted-foreground);line-height:1.45;margin-top:9px}
  .dtb-pop .pb .hint b{color:var(--foreground);font-weight:600}
  .dtb-pop .mi{display:flex;justify-content:space-between;padding:7px 10px;border-radius:7px;font-size:12.5px;cursor:pointer}
  .dtb-pop .mi:hover{background:var(--primary-light);color:var(--primary-dark)}
  .dtb-pop .mi kbd{font:inherit;font-size:11px;color:var(--muted-foreground)}
  .dtb-pop .msep{height:1px;background:var(--border);margin:4px 2px}
  @media (prefers-reduced-motion:no-preference){ .dtb-pop{animation:popin .14s ease-out} }
  @keyframes popin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ===== Summary card with book-spine shelf =====
     Each active view element is a spine. Hover or focus pulls one spine out
     horizontally to read it; the others stay put on the shelf. */
  .sumcard{position:absolute;left:14px;top:12px;z-index:25;background:rgba(255,255,255,.96);
    border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:7px 10px 0;max-width:calc(100% - 28px)}
  .sumcard.bl{top:auto;bottom:16px}
  .sumcard .canvas-stat{position:static;border:none;background:none;padding:0 0 7px;font-size:11px}
  .sumcard .sumhd{display:flex;align-items:center;gap:10px;padding-bottom:7px;font-size:11px;color:var(--muted-foreground)}
  .sumcard .sumhd .canvas-stat{padding:0}
  .sumcard .sumhd .sp{flex:1}
  .sumcard .sumhd .saved b{color:var(--foreground);font-weight:600}
  .sumcard .sumhd .rall{color:var(--primary);font-weight:600;cursor:pointer}
  .sumcard .sumhd .rall:hover{text-decoration:underline}
  .shelf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 3px;padding:0 2px;border-bottom:3px solid #d9d6e3}
  .shelf .bookend{width:8px;flex:none}
  .book{flex:none;display:flex;width:26px;overflow:hidden;border-radius:3px 3px 1px 1px;border:1px solid;border-bottom:none;
    transition:width .22s ease;outline:none;cursor:default}
  .book:hover,.book:focus-within,.book:focus{width:224px}
  .book:focus-visible{box-shadow:0 0 0 2px var(--primary)}
  .book .spine{flex:none;width:24px;writing-mode:vertical-rl;font-size:10.5px;font-weight:600;letter-spacing:.01em;
    padding:9px 0 8px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:24px;max-height:150px}
  .book .cover{flex:none;width:198px;padding:8px 10px 8px 6px;display:flex;flex-direction:column;opacity:0;transition:opacity .15s ease .05s}
  .book:hover .cover,.book:focus-within .cover,.book:focus .cover{opacity:1}
  .book .cover .cv{font-size:12.5px;font-weight:700;color:var(--foreground);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book .cover .cd{font-size:10.5px;color:var(--muted-foreground);line-height:1.35;margin-top:3px;flex:1;overflow:hidden}
  .book .cover .clr{align-self:flex-start;font:inherit;font-size:11px;font-weight:600;padding:2px 9px;border-radius:5px;
    border:1px solid var(--border);background:#fff;cursor:pointer;margin-top:4px}
  .book .cover .clr:hover{border-color:var(--primary);color:var(--primary)}
  /* category encodes what kind of change it is: scope (which assets),
     context (what cards say), view (how you are looking) */
  .book.scope{min-height:88px;background:#efecf7;border-color:#dcd5ec;box-shadow:inset 0 3px 0 #9b7fd0}
  .book.scope .spine{color:#3d2a66}
  .book.context{min-height:80px;background:#e9f2f0;border-color:#d0e2de;box-shadow:inset 0 3px 0 #3f9a8a}
  .book.context .spine{color:#1f4d45}
  .book.view{min-height:72px;background:#f4f1e8;border-color:#e4dcc6;box-shadow:inset 0 3px 0 #c49a3c}
  .book.view .spine{color:#5b4712}
  @media (prefers-reduced-motion:reduce){.book,.book .cover{transition:none}}

  .stage{position:relative}
  .stage .ltable-card{padding-bottom:84px}

  /* toolbar tooltips */
  .tip{position:fixed;z-index:400;pointer-events:none;background:#1e1b26;color:#fff;border-radius:7px;padding:6px 9px;
    font-size:12px;line-height:1.35;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;transform:translateY(3px);
    transition:opacity .12s ease,transform .12s ease}
  .tip.show{opacity:1;transform:none}
  .tip .tn{font-weight:600;display:flex;align-items:center;gap:10px}
  .tip .tk{margin-left:auto;font-weight:500;color:#b9b4c8;font-size:11px;white-space:nowrap}
  .tip .ts{color:#cfcbdb;font-size:11px;margin-top:1px}
  .tip::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1e1b26}
  @media (prefers-reduced-motion:reduce){.tip{transition:none}}

  /* ---- card detail bars: an accordion strip, after The Pudding's
     "most popular post each day" row. The row keeps its width; the hovered
     slice opens into the free space and the other slices draw in to make
     room, so nothing jumps to another line or off the card. ---- */
  .ncard .tags{overflow:hidden;align-items:center;flex-wrap:wrap;gap:3.5px 3px;padding:1px 4px 1px 1px;margin:3px -4px -1px -1px}
  .ncard .tg{flex:none}
  .ncard .dgrp{display:flex;gap:1px;flex:0 0 auto;min-width:0;
    transition:flex-grow .3s cubic-bezier(.2,.75,.25,1),flex-basis .3s cubic-bezier(.2,.75,.25,1)}
  .ncard .dgrp:has(.dbar.open){flex:1 1 0}
  .dbar{position:relative;flex:0 0 4px;min-width:0;height:10.5px;border-radius:2px;background:var(--bg);
    box-shadow:inset 0 0 0 1px var(--bd);overflow:hidden;display:flex;align-items:center;cursor:default;
    transition:flex-grow .3s cubic-bezier(.2,.75,.25,1),flex-basis .3s cubic-bezier(.2,.75,.25,1),
      border-radius .3s ease,box-shadow .2s ease,transform .2s ease}
  .dbar.more{background-image:repeating-linear-gradient(0deg,var(--bd) 0 1px,transparent 1px 3px)}
  .dbar.open{flex:1 1 0;max-width:150px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--fg);transform:scale(1.05);background-image:none}
  /* the rest of the strip draws in (single-line rows only, so a wrapped row
     never reshuffles its lines while you hover) */
  .ncard .tags:not(.wrapped):has(.dbar.open) .dbar:not(.open){flex-basis:2px}
  .dbar .dl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:7px;font-weight:700;line-height:10.5px;color:var(--fg);padding:0 5px;
    opacity:0;transform:translateX(-4px);transition:opacity .15s ease,transform .25s ease}
  .dbar.open .dl{opacity:1;transform:none;transition-delay:.08s}
  .dbar .dk{font-weight:500;opacity:.8}
  .dbar .dl .tcert{font-size:7px}
  .checks .swatch{display:inline-block;width:6px;height:13px;border-radius:2px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--bd);margin-left:auto;flex:none}
  @media (prefers-reduced-motion:reduce){.dbar,.dbar .dl,.ncard .dgrp{transition:none}.dbar.open{transform:none}}

  /* loading intro */
  .intro-layer{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:40}
  .intro-pill{position:absolute;left:0;top:0;will-change:transform,opacity}
  .intro-cap{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 14px 6px 12px;font-size:12px;color:var(--muted-foreground);
    box-shadow:0 4px 14px rgba(20,16,40,.1);pointer-events:none;white-space:nowrap}
  .intro-cap b{color:var(--foreground)}
  .intro-dots{display:inline-flex;gap:3px}
  .intro-dots i{width:4px;height:10px;border-radius:2px;background:#d6bff5;animation:introbar 0.9s ease-in-out infinite}
  .intro-dots i:nth-child(2){background:#a9d6f3;animation-delay:.12s}
  .intro-dots i:nth-child(3){background:#9ee0d0;animation-delay:.24s}
  @keyframes introbar{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.15)}}

  .dtb-btn.on{background:var(--primary-light);color:var(--primary-dark)}
  /* views menu */
  .vmenu{position:relative}
  .vm-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);
    border-radius:var(--radius);background:#fff;cursor:pointer;max-width:240px;color:var(--foreground)}
  .vm-btn:hover{border-color:#c9c3d6}
  .vmenu.open .vm-btn{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
  .vm-k{color:var(--muted-foreground)}
  .vm-v{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vm-dot{width:6px;height:6px;border-radius:50%;background:#d9a24a;flex:none}
  .vm-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:250px;background:#fff;border:1px solid var(--border);
    border-radius:10px;box-shadow:0 12px 32px rgba(20,16,40,.16);padding:5px}
  .vm-h{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);padding:7px 10px 4px}
  .vm-item{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer}
  .vm-item:hover{background:var(--primary-light);color:var(--primary-dark)}
  .vm-item.on{font-weight:600}
  .vm-item.act{color:var(--primary);font-weight:600}
  .vm-ck{width:14px;flex:none;text-align:center;color:var(--primary)}
  .vm-sub{margin-left:auto;font-size:11px;color:#b07a1e;font-weight:500}

<script>
"use strict";
const FEATURE_NAME = "Lineage View Controls";
const CONFIG_TOP_TABS=["Data","Catalog","Governance","Quality","Import","Security","AI","APIs"];
const SUBTABS_BY_TOPTAB={"Catalog":["Semantic Types","Semantic Type Fields","Tag Types","Navigation"],
 "Governance":["Technical Assets","Business Assets","Models","Policies","Relationships","Predicates","Reference Lists"]};
const MODULE_TABS={"Catalog":["Overview","All Assets","Certified BusinessTerms","Datasources","Datasets","Fields","Technical","Business","Tags","Jobs"]};

/* ==========================================================================
   1. GRAPH  —  Customer / PII pipeline, ~200 datasets, edges harvested at
   field level (datasets carry derived edges), strictly layered so acyclic.
   ========================================================================== */
function lcg(s){let x=s>>>0;return()=>((x=(x*1664525+1013904223)>>>0)/4294967296);}
const rnd = lcg(20260904);
const pick = a => a[Math.floor(rnd()*a.length)];
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

const OWNERS=["M. Bank","D. Shuman","R. Patel","J. Okafor","L. Chen","S. Rao","A. Novak","T. Ferreira","K. Adeyemi","—"];
const DOMAINS=["Customer","Marketing","Finance","Risk & Compliance","Product","HR"];
const PII_ENTS=["CUSTOMER","CONTACT","ADDRESS","EMAIL","PHONE","IDENTITY","KYC","HOUSEHOLD","CONSENT","LEAD","DEMOGRAPHIC"];
const RELS=["reads","transforms","copies","aggregates","writes"];

/* Policies are named governance rules attached to an ASSET.
   PII is a property of a FIELD and is shown on fields only — a node-level "PII"
   policy was just restating the field badges. */
const POLICY_POOL=[
  {k:"GDPR",          long:"GDPR — Subject Data",                 kind:"pii"},
  {k:"GDPR Art.17",   long:"GDPR Art. 17 — Right to Erasure",     kind:"pii"},
  {k:"CCPA",          long:"CCPA — Consumer Data",                 kind:"pii"},
  {k:"Masking",       long:"Masking Required — Non-Prod",          kind:"pii"},
  {k:"Cross-Border",  long:"Cross-Border Transfer — Restricted",   kind:"pii"},
  {k:"PCI-DSS",       long:"PCI-DSS 3.4 — Cardholder Data",        kind:"fin"},
  {k:"SOX",           long:"SOX — Financial Reporting",            kind:"fin"},
  {k:"Retention 7y",  long:"Data Retention — 7 years",             kind:"any"},
  {k:"Internal Only", long:"Internal Use Only",                    kind:"any"},
];
const POLICY_KEYS=POLICY_POOL.map(p=>p.k);

/* Metrics are business context too — DGOV-409 groups the technical asset's
   business context as Terms, Metrics and Policies. Metrics attach to
   aggregated and reporting assets far more than to raw ingest. */
const METRIC_POOL=["Customer Lifetime Value","Churn Rate","Active Customer Count",
  "Net Promoter Score","Customer Acquisition Cost","Retention Rate",
  "Average Revenue Per Customer","Consent Opt-In Rate","Marketing Reachability",
  "Household Penetration","Complaint Rate","First Contact Resolution"];
const RELATED_TERM={"Customer":"Party","Address":"Location","Consent":"Consent Record",
  "Customer 360":"Customer Profile","Master Customer":"Party","Customer Active":"Active Party"};
function assignMetrics(id,h,layer){
  const r=lcg(h^0x2f6d3ab1), out=[];
  const chance = layer>=1 ? .62 : (layer>=0 ? .3 : .08);
  if(r()>chance) return out;
  const n = r()<.68 ? 1 : 2;
  while(out.length<n){
    const m=METRIC_POOL[Math.floor(r()*METRIC_POOL.length)];
    if(!out.includes(m)) out.push(m);
  }
  return out;
}
function policyList(n){return n.policies||[];}
function policyShort(n){
  const ps=policyList(n); if(!ps.length) return null;
  return "Policy: "+ps[0].k+(ps.length>1?` +${ps.length-1}`:"");
}
function policyFull(n){return policyList(n).map(p=>p.long).join(" · ")||"—";}

const DS={};            // id -> dataset node
const EDGES=[];         // {a,b,rel,xform}
const UP={}, DOWN={};
const ANCHOR="DIM_CUSTOMER";

function assignPolicies(id,h,isPII){
  const r=lcg(h^0x5bf03635), out=[];
  const pii=POLICY_POOL.filter(p=>p.kind==="pii");
  const fin=POLICY_POOL.filter(p=>p.kind==="fin");
  const any=POLICY_POOL.filter(p=>p.kind==="any");
  const take=pool=>{const p=pool[Math.floor(r()*pool.length)];if(p&&!out.includes(p))out.push(p);};
  // An asset carrying personal data gets a personal-data policy first. Generic
  // rules (retention, internal-only) come second, so the interesting policies
  // land on the customer path where the demo actually looks.
  if(isPII){ take(pii); if(r()<0.42) take(r()<0.6?pii:any); }
  else if(h%4===0){ take(fin); if(r()<0.3) take(any); }
  else if(r()<0.45){ take(any); }
  return out;
}
function addDS(o){
  if(DS[o.id]) return null;
  const ent=(o.id.split("_").slice(1).join("_")||o.id);
  const isPII=PII_ENTS.some(p=>o.id.includes(p));
  const h=hash(o.id);
  DS[o.id]=Object.assign({
    dq: 58+(h%42),
    // Governance score is its own thing in DIS — how well the asset is
    // described and stewarded, not how clean the data is. Correlated with
    // whether a term is assigned, which is what makes it a business signal.
    gov: 0,
    certified: (h%100)<24,
    domain: DOMAINS[h%DOMAINS.length],
    // Business terms are NOT assigned everywhere. Coverage thins out at the raw
    // and export ends of the pipeline, which is the gap a CDO wants to see.
    term: ((h%100)<26 || (Math.abs(o.layer)>=4 && (h%100)<64))
            ? null
            : ent.split("_").map(w=>w[0]+w.slice(1).toLowerCase()).join(" "),
    policies: assignPolicies(o.id,h,isPII),
    metrics: assignMetrics(o.id,h,o.layer),
    owner: OWNERS[h%OWNERS.length],
    pii: isPII,
  }, o);
  UP[o.id]=[];DOWN[o.id]=[];
  const d=DS[o.id];
  // DGOV-409 allows associations without predicate restrictions, so an asset can
  // carry several terms. The headline shows the first, with "+n" for the rest.
  d.terms = d.term ? (((h%9)===0 && RELATED_TERM[d.term]) ? [d.term,RELATED_TERM[d.term]] : [d.term]) : [];
  if(!o.gov){
    // described + stewarded + certified + policy-tagged → a governance score
    let g=26;
    if(d.term) g+=30;
    if(d.owner!=="—") g+=18;
    if(d.certified) g+=14;
    if(policyList(d).length) g+=8;
    d.gov=Math.max(8,Math.min(100,g+((h>>7)%9)-4));
  }
  UP[o.id]=[];DOWN[o.id]=[];
  return d;
}
function addEdge(a,b){
  if(a===b||!DS[a]||!DS[b]) return;
  if(DOWN[a].includes(b)) return;
  DOWN[a].push(b);UP[b].push(a);
  EDGES.push({a,b,rel:pick(RELS),xform: rnd()>.74 ? (200+Math.floor(rnd()*10200)) : 0});
}

/* layer specs: prefixes × entities × a system, generated to an exact count */
const LSPEC=[
  {d:-5,groups:[
    {n:6, sys:"Salesforce",type:"Object",src:"Salesforce · PROD",path:"Salesforce › PROD",pfx:["SF"],ents:["ACCOUNT","CONTACT","LEAD","OPPORTUNITY","CAMPAIGN_MEMBER","CONSENT"]},
    {n:4, sys:"Oracle",type:"Table",src:"Oracle · HRDB",path:"Oracle › HRDB › HR",pfx:["HR"],ents:["EMPLOYEE","DEPARTMENT","ROLE","LOCATION"]},
    {n:6, sys:"SQL Server",type:"Table",src:"SQL Server · CRMDB",path:"SQL Server › CRMDB › dbo",pfx:["CRM"],ents:["CUSTOMER","ADDRESS","PHONE","PREFERENCE","TICKET","INTERACTION"]},
    {n:4, sys:"Kafka",type:"Topic",src:"Kafka · streams",path:"Kafka › streams",pfx:["EVT"],ents:["CUSTOMER_UPDATED","CONSENT_CHANGED","ORDER_PLACED","PAYMENT_RECEIVED"]},
    {n:2, sys:"Db2",type:"Table",src:"Db2 · BILLING",path:"Db2 › BILLING",pfx:["BL"],ents:["INVOICE","PAYMENT"]},
  ]},
  {d:-4,groups:[
    {n:18,sys:"Amazon S3",type:"File",src:"Amazon S3 · landing",path:"Amazon S3 › prcs-landing",pfx:["LND"],
     ents:["SF_ACCOUNT","SF_CONTACT","SF_LEAD","CRM_CUSTOMER","CRM_ADDRESS","CRM_PHONE","HR_EMPLOYEE","BL_INVOICE","BL_PAYMENT","EVT_CUSTOMER","EVT_CONSENT","EVT_ORDER","SF_CONSENT","CRM_TICKET","CRM_PREFERENCE","HR_ROLE","EVT_PAYMENT","SF_CAMPAIGN"]},
  ]},
  {d:-3,groups:[
    {n:20,sys:"Snowflake",type:"Table",src:"Snowflake · RAW",path:"Snowflake › PRCS › RAW",pfx:["RAW"],
     ents:["CUSTOMER","CONTACT","ACCOUNT","LEAD","ADDRESS","PHONE","EMAIL","CONSENT","PREFERENCE","TICKET","INTERACTION","EMPLOYEE","INVOICE","PAYMENT","ORDER","CAMPAIGN","HOUSEHOLD","IDENTITY","KYC","DEMOGRAPHIC"]},
  ]},
  {d:-2,groups:[
    {n:27,sys:"Snowflake",type:"Table",src:"Snowflake · STAGE",path:"Snowflake › PRCS › STAGE",pfx:["STG","SRC"],
     ents:["CUSTOMER","CUSTOMER_ADDRESS","CUSTOMER_EMAIL","CUSTOMER_PHONE","CONTACT","ACCOUNT","LEAD","CONSENT","PREFERENCE","TICKET","INTERACTION","EMPLOYEE","INVOICE","PAYMENT","ORDER","CAMPAIGN","HOUSEHOLD","IDENTITY","KYC","DEMOGRAPHIC","GEO","CHANNEL","SEGMENT","LOYALTY"]},
  ]},
  /* the funnel: everything upstream converges on three CORE tables */
  {d:-1,groups:[
    {n:3, sys:"Snowflake",type:"Table",src:"Snowflake · CORE",path:"Snowflake › PRCS › CORE",pfx:["DIM"],
     ents:["MASTER_CUSTOMER","ADDRESS","CONSENT"]},
  ]},
  /* and fans back out through four marts */
  {d:1,groups:[
    {n:3, sys:"Snowflake",type:"Table",src:"Snowflake · MART",path:"Snowflake › PRCS › MART",pfx:["MART"],
     ents:["CUSTOMER_360","CUSTOMER_RISK","MARKETING_AUDIENCE"]},
    {n:1, sys:"Snowflake",type:"View",src:"Snowflake · MART",path:"Snowflake › PRCS › MART",pfx:["VW"],
     ents:["CUSTOMER_ACTIVE"]},
  ]},

let P={nodes:{},up:{},down:{},edges:[],anchor:ANCHOR};
function project(){
  if(V.grain==="Datasource"){
    const nodes={},up={},down={},edges=[],seen={};
    const srcOf=id=>DS[id].src;
    Object.values(DS).forEach(d=>{
      const s=d.src;
      if(!nodes[s]){
        nodes[s]={id:s,name:s,sys:d.sys,type:"Datasource",path:d.path.split(" › ").slice(0,2).join(" › "),
          members:[],dq:0,gov:0,certified:false,domain:d.domain,term:null,terms:[],policies:[],metrics:[],owner:"—",pii:false,layer:d.layer,piiFields:0};
        up[s]=[];down[s]=[];
      }
      const g=nodes[s]; g.members.push(d.id);
      g.pii = g.pii || d.pii;
      g.certified = g.certified || d.certified;
      g.layer = Math.min(g.layer, d.layer);
    });
    Object.values(nodes).forEach(g=>{
      g.dq=Math.round(g.members.reduce((s,m)=>s+DS[m].dq,0)/g.members.length);
      g.gov=Math.round(g.members.reduce((s,m)=>s+DS[m].gov,0)/g.members.length);
      const owners=[...new Set(g.members.map(m=>DS[m].owner).filter(o=>o!=="—"))];
      g.owner = owners.length===1?owners[0]:(owners.length?owners.length+" owners":"—");
      const doms=[...new Set(g.members.map(m=>DS[m].domain))];
      g.domain = doms.length===1?doms[0]:doms.length+" domains";
      // a datasource inherits the union of its datasets' policies
      const seenP=new Set();
      g.policies=[];
      g.members.forEach(m=>policyList(DS[m]).forEach(p=>{if(!seenP.has(p.k)){seenP.add(p.k);g.policies.push(p);}}));
      const seenM=new Set();
      g.metrics=[];
      g.members.forEach(m=>(DS[m].metrics||[]).forEach(x=>{if(!seenM.has(x)){seenM.add(x);g.metrics.push(x);}}));
      g.piiFields=g.members.reduce((s,m)=>s+piiFieldCount(m),0);
      g.termCoverage=g.members.filter(m=>DS[m].term).length;
    });
    EDGES.forEach(e=>{
      const a=srcOf(e.a),b=srcOf(e.b);
      if(a===b) return;
      const key=a+"→"+b; if(seen[key]) { seen[key].n++; if(e.xform) seen[key].xform+=e.xform; return; }
      const rec={a,b,rel:"derived",xform:e.xform||0,n:1}; seen[key]=rec; edges.push(rec);
      down[a].push(b);up[b].push(a);
    });
    P={nodes,up,down,edges,anchor:srcOf(V.anchor)};
  } else {
    P={nodes:DS,up:UP,down:DOWN,edges:EDGES,anchor:V.anchor};

}

function passes(id){
  const n=P.nodes[id];
  if(id===P.anchor) return true;                  // the anchor is never filtered away
  return V.filters.every(f=>{
    switch(f.k){
      case "Data source":   return f.op==="is" ? n.sys===f.v : n.sys!==f.v;
      case "Quality score": return f.op==="≥" ? n.dq>=+f.v : n.dq<+f.v;
      case "Governance score": return f.op==="≥" ? n.gov>=+f.v : n.gov<+f.v;
      case "Certification": return f.v==="Certified" ? !!n.certified : !n.certified;
      case "Domain":        return f.op==="is" ? n.domain===f.v : n.domain!==f.v;
      case "Owner":         return n.owner===f.v;
      case "Policy":        { const has=policyList(n).some(p=>p.k===f.v);
                              return f.op==="has" ? has : !has; }
      case "PII":           { const has=piiCountOf(id)>0; return f.op==="has" ? has : !has; }
      case "Metric":        { const m=n.metrics||[];
                              const has=f.v==="Any metric" ? m.length>0 : m.includes(f.v);
                              return f.op==="has" ? has : !has; }
      case "Business term": { const has=!!bizTitle(n);
                              return f.v==="Assigned" ? (f.op==="is"?has:!has) : (f.op==="is"?!has:has); }
      case "Asset type":    return f.op==="is" ? n.type===f.v : n.type!==f.v;

/* ==========================================================================
   5. TRAVERSAL — reach + per-branch expansion, counted in the displayed grain
   ========================================================================== */
function reachOf(id,dir){
  const base = dir==="up" ? V.up : V.down;
  const b = V.branch[id];
  return Math.max(base, b ? (b[dir]||0) : 0);
}
function traverse(){
  const depth={},budget={};
  const start=P.anchor;
  if(!P.nodes[start]) return {ids:[],depth:{}};
  depth[start]=0;
  const q=[[start,V.up,V.down]];
  budget[start]=[V.up,V.down];
  // per-branch expansion raises the budget locally
  const seen=new Set([start]);
  while(q.length){
    const [id,bu,bd]=q.shift();
    const bu2=Math.max(bu, (V.branch[id]&&V.branch[id].up)||0);
    const bd2=Math.max(bd, (V.branch[id]&&V.branch[id].down)||0);
    if(bu2>0) (P.up[id]||[]).forEach(p=>{
      if(!seen.has(p)){seen.add(p);depth[p]=depth[id]-1;q.push([p,bu2-1,0]);}
    });
    if(bd2>0) (P.down[id]||[]).forEach(c=>{
      if(!seen.has(c)){seen.add(c);depth[c]=depth[id]+1;q.push([c,0,bd2-1]);}
    });
  }
  // pinned nodes revealed by search
  (V.pinned||[]).forEach(id=>{ if(P.nodes[id]&&!seen.has(id)){seen.add(id);depth[id]=(P.nodes[id].layer||0)-(P.nodes[start].layer||0);} });
  // apply filters
  let ids=[...seen].filter(passes);
  if(!ids.includes(start)) ids.push(start);
  return {ids,depth};
}
function hiddenNeighbours(id,dir,visSet){
  return ((dir==="up"?P.up[id]:P.down[id])||[]).filter(x=>!visSet.has(x)).length;

/* bridges: a visible→visible hop that passes only through filtered-out nodes */
function bridges(ids){
  const vis=new Set(ids), out=[];
  const filteredOut=id=>P.nodes[id]&&!vis.has(id);
  ids.forEach(a=>{
    const stack=(P.down[a]||[]).filter(filteredOut).map(x=>[x,1]);
    const best={};
    const guard=new Set();
    while(stack.length){
      const [n,d]=stack.pop();
      if(d>3||guard.has(n+":"+d)) continue; guard.add(n+":"+d);
      (P.down[n]||[]).forEach(x=>{
        if(vis.has(x)){ if(best[x]===undefined||best[x]>d) best[x]=d; }
        else if(d<3) stack.push([x,d+1]);
      });
    }
    Object.entries(best).forEach(([b,n])=>{ if(b!==a) out.push({a,b,hidden:n}); });
  });

}

function layout(ids,depth){

  const keys=Object.keys(layers).map(Number).sort((a,b)=>a-b);
  const order={}; keys.forEach(k=>order[k]=layers[k].slice());
  const m={};
  const reindex=k=>order[k].forEach((id,i)=>m[id]=i);
  keys.forEach(reindex);

  keys.forEach((k,ki)=>{

  // hand-placed nodes win over the computed layout
  ids.forEach(id=>{ const o=V.nodePos[id]; if(o&&pos[id]){pos[id].x=o.x;pos[id].y=o.y;} });
  let cw=PADX*2+(keys.length-1)*COLW+CARDW, ch=maxH+PADY*2;
  ids.forEach(id=>{const p=pos[id];if(p){cw=Math.max(cw,p.x+CARDW+PADX);ch=Math.max(ch,p.y+p.h+PADY);}});
  return {pos,cw,ch,keys,order};
}

/* ==========================================================================
   6b. STICKY LAYOUT
   Expanding a node is a *local* action, so it must not reshuffle the picture.
   Committed positions persist in V.stickyPos; new nodes are appended next to
   their parent in free space. Global changes (reach, grain, filters, anchor)
   clear the sticky store and re-run the full layered layout, as does Tidy.
   ========================================================================== */
function reflow(){V.stickyPos={};}

function appendPlace(newIds,pos,depth,ideal){
  // group new nodes by the neighbour they hang off, so siblings arrive as a
  // block centred on their parent rather than stacked below it
  const groups={};
  newIds.forEach(id=>{
    const parents=(P.up[id]||[]).filter(x=>pos[x]);
    const kids=(P.down[id]||[]).filter(x=>pos[x]);
    let key,x,yw;
    if(parents.length>=kids.length&&parents.length){
      const p=parents.reduce((a,b)=>pos[a].x>=pos[b].x?a:b);
      key="d:"+p; x=pos[p].x+COLW; yw=pos[p].y+pos[p].h/2;
    }else if(kids.length){
      const k=kids.reduce((a,b)=>pos[a].x<=pos[b].x?a:b);
      key="u:"+k; x=pos[k].x-COLW; yw=pos[k].y+pos[k].h/2;
    }else{
      key="free:"+id; x=ideal[id]?ideal[id].x:0; yw=ideal[id]?ideal[id].y:0;
    }
    (groups[key]=groups[key]||{x,yw,ids:[]}).ids.push(id);
  });
  Object.values(groups).forEach(g=>{
    const hs=g.ids.map(id=>cardH(id));
    const total=hs.reduce((s,h)=>s+h+GAP,-GAP);
    let y=g.yw-total/2;
    g.ids.forEach((id,i)=>{pos[id]={x:g.x,y,h:hs[i]};y+=hs[i]+GAP;});
  });
}
function deOverlap(pos,ids){
  const cols={};
  ids.forEach(id=>{const k=Math.round(pos[id].x/24)*24;(cols[k]=cols[k]||[]).push(id);});
  Object.values(cols).forEach(list=>{
    list.sort((a,b)=>pos[a].y-pos[b].y);
    for(let i=1;i<list.length;i++){
      const prev=pos[list[i-1]],cur=pos[list[i]];
      if(cur.y<prev.y+prev.h+GAP) cur.y=prev.y+prev.h+GAP;
    }
  });
}
function resolveLayout(ids,depth){
  const ideal=layout(ids,depth);
  const sticky=V.stickyPos||{};
  const known=ids.filter(id=>sticky[id]);
  const pos={};
  if(!known.length){
    // fresh or just tidied — take the layered layout wholesale
    ids.forEach(id=>pos[id]={x:ideal.pos[id].x,y:ideal.pos[id].y,h:cardH(id)});
  }else{
    known.forEach(id=>pos[id]={x:sticky[id].x,y:sticky[id].y,h:cardH(id)});
    const fresh=ids.filter(id=>!sticky[id]);
    if(fresh.length) appendPlace(fresh,pos,depth,ideal.pos);
    deOverlap(pos,ids);
  }
  // hand-placed nodes always win
  ids.forEach(id=>{const o=V.nodePos[id];if(o){pos[id].x=o.x;pos[id].y=o.y;}});
  // normalise into positive space; the uniform shift is absorbed by the pin
  const minX=Math.min(...ids.map(i=>pos[i].x)), minY=Math.min(...ids.map(i=>pos[i].y));
  const dx=PADX-minX, dy=PADY-minY;
  ids.forEach(id=>{pos[id].x+=dx;pos[id].y+=dy;});
  // Commit BOTH stores in the normalised space. Re-committing nodePos matters:
  // sticky positions get shifted by each normalisation while a raw override
  // would be re-applied unshifted, so a hand-placed node drifted relative to
  // everything else a little more on every render (Req 6 AC4).
  V.stickyPos=V.stickyPos||{};
  ids.forEach(id=>{
    V.stickyPos[id]={x:pos[id].x,y:pos[id].y};
    if(V.nodePos[id]) V.nodePos[id]={x:pos[id].x,y:pos[id].y};
  });
  const cw=Math.max(...ids.map(i=>pos[i].x+CARDW))+PADX;
  const ch=Math.max(...ids.map(i=>pos[i].y+pos[i].h))+PADY;
  return {pos,cw:Math.max(cw,600),ch:Math.max(ch,320),keys:ideal.keys};
}

/* ==========================================================================
   7. RENDER — canvas
   ========================================================================== */
let LAST={ids:[],depth:{},pos:{},bridges:[],cw:0,ch:0};
let PIN=null, PREV_IDS=[], FLASH=[], PENDING_FLASH=false;
function pinNode(id){const p=LAST.pos[id];if(p)PIN={id,x:p.x,y:p.y};PENDING_FLASH=true;}
/* The toolbar now lives inside the diagram, across its top. Centring and
   fitting work in the area below it. */
const VIEW_TOP=66;
function viewportSize(){
  const w=document.getElementById("lin-canvas-wrap");
  const top=(w&&w.querySelector(".lin-toolbar"))?VIEW_TOP:0;
  return {w:w?w.clientWidth:1000,h:(w?w.clientHeight:640)-top,top};
}
function matchesQuery(id){
  if(!V.query) return false;
  const q=V.query.toUpperCase();
  if(id.toUpperCase().includes(q)) return true;
  if(V.grain!=="Datasource" && fieldsOf(id).some(f=>f.name.includes(q))) return true;
  return false;
}
function canvasHTML(){
  project();

    const keep=new Set([P.anchor]);
    ids.filter(matchesQuery).forEach(m=>{ pathToAnchor(m).forEach(x=>keep.add(x)); });
    ids=ids.filter(x=>keep.has(x));
  }
  const visSet=new Set(ids);
  const br=V.filters.length?bridges(ids):[];

  // Keep the node the user just interacted with on the same screen pixel.
  if(PIN&&L.pos[PIN.id]){

  }
  // Which nodes just appeared — used for the ring and the "show them" link.
  if(PENDING_FLASH){FLASH=ids.filter(x=>!PREV_IDS.includes(x));PENDING_FLASH=false;}
  PREV_IDS=ids.slice();
  LAST={ids,depth,pos:L.pos,bridges:br,cw:L.cw,ch:L.ch};

  const paths=buildEdgeSVG(visSet,L.pos);
  const bpaths=buildBridgeSVG(br,L.pos);
  const blabels=br.map(b=>{
    const A=L.pos[b.a],B=L.pos[b.b]; if(!A||!B) return "";
    const x=(A.x+CARDW+B.x)/2-16,y=(A.y+A.h/2+B.y+B.h/2)/2-6;
    return `<div class="blabel" style="left:${x}px;top:${y}px">${b.hidden} hidden</div>`;
  }).join("");
  const elabels=!V.overlays.rel?"":P.edges.filter(e=>visSet.has(e.a)&&visSet.has(e.b)).slice(0,120).map(e=>{
    const A=L.pos[e.a],B=L.pos[e.b]; if(!A||!B) return "";
    const x=(A.x+CARDW+B.x)/2-14,y=(A.y+A.h/2+B.y+B.h/2)/2-5;
    return `<div class="elabel" style="left:${x}px;top:${y}px">${e.rel}${e.n>1?` ×${e.n}`:""}</div>`;
  }).join("");

  const offscreen=FLASH.filter(id=>!onScreen(L.pos[id])).length;
  const stat=`<div class="canvas-stat">Showing <b>${ids.length}</b> of ${V.grain==="Datasource"?Object.keys(P.nodes).length:TOTAL_DS} ${V.grain==="Datasource"?"datasources":"datasets"}${br.length?` · <b>${br.length}</b> bridged`:""} · zoom ${zoomPct()}%${
    FLASH.length?` · <b>${FLASH.length}</b> revealed${offscreen?` <a class="statlink" onclick="focusRevealed();event.stopPropagation()">show ${offscreen} off-screen →</a>`:""}`:""}</div>`;
  const flashSet=new Set(FLASH);
  FLASH=[];   // the ring plays once, on the render that follows the expansion

  return `
  <div class="canvas-wrap ${UI.fs?"fs":""} ${biz()?"biz":""}" id="lin-canvas-wrap" onmousedown="startPan(event)" onwheel="onWheel(event)">
    ${toolbarHTML("graph")}
    <div class="canvas ${biz()?"biz":""}" id="lin-canvas" style="width:${L.cw}px;height:${L.ch}px;transform:translate(${V.panX}px,${V.panY}px) scale(${V.zoom})">
      <svg class="cedges" id="cedges" width="${L.cw}" height="${L.ch}">${paths}${bpaths}</svg>
      ${ids.map(id=>card(id,L.pos[id],visSet,flashSet.has(id))).join("")}${elabels}${blabels}
    </div>
    ${stat}
    ${inScope("minimap")&&UI.minimap!==false?minimapHTML(L):``}
    ${dockHTML("graph")}
  </div>`;
}
/* Edge drawing is factored out of canvasHTML so a node drag can redraw the
   SVG on its own, without rebuilding the whole page on every mousemove. */
function buildEdgeSVG(visSet,pos){
  return P.edges.filter(e=>visSet.has(e.a)&&visSet.has(e.b)).map(e=>{
    const A=pos[e.a],B=pos[e.b]; if(!A||!B) return "";
    if(V.openFields[e.a]&&V.openFields[e.b]&&V.grain!=="Datasource") return fieldEdges(e,A,B);
    const x1=A.x+CARDW,y1=A.y+A.h/2,x2=B.x,y2=B.y+B.h/2,dx=Math.max(34,Math.abs(x2-x1)/2);
    const hi=V.overlays.xform&&e.xform;
    // On the grey business-layer ground a light grey stroke disappears, so the
    // edges go darker rather than more transparent — still subordinate to the cards.
    const stroke = hi ? (biz()?"#7a14d4":"#8017e1") : (biz()?"#a2a2b4":"#c6c6d2");
    return `<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" stroke="${stroke}" stroke-width="${hi?1.8:1.1}" opacity="${V.query&&V.searchMode==="highlight"?.5:1}"/>`;
  }).join("");
}
function buildBridgeSVG(br,pos){
  return br.map(b=>{
    const A=pos[b.a],B=pos[b.b]; if(!A||!B) return "";
    const x1=A.x+CARDW,y1=A.y+A.h/2,x2=B.x,y2=B.y+B.h/2,dx=Math.max(34,Math.abs(x2-x1)/2);
    return `<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" stroke="#d9a24a" stroke-width="1.3" stroke-dasharray="5 4"/>`;
  }).join("");
}
function redrawEdges(){
  const svg=document.getElementById("cedges"); if(!svg) return;
  const visSet=new Set(LAST.ids);
  svg.innerHTML=buildEdgeSVG(visSet,LAST.pos)+buildBridgeSVG(LAST.bridges,LAST.pos);
}
/* ---- camera helpers. Panning is transform-only (the wrapper no longer
   scrolls), so canvas↔screen is a single clean mapping and the minimap
   viewport can be derived from it. ---- */
function visibleRect(){
  const {w,h,top}=viewportSize();
  return {x:-V.panX/V.zoom, y:(top-V.panY)/V.zoom, w:w/V.zoom, h:h/V.zoom};
}
function onScreen(p){
  if(!p) return true;
  const r=visibleRect();
  return p.x+CARDW>r.x && p.x<r.x+r.w && p.y+p.h>r.y && p.y<r.y+r.h;
}
function centreOn(cx,cy){
  const {w,h,top}=viewportSize();
  V.panX=-(cx*V.zoom-w/2); V.panY=-(cy*V.zoom-(top+h/2));
}
/* Soft clamp so a stray drag can't lose the graph entirely. Applied to
   user-driven panning only — never to the pin compensation, which must be exact. */
function clampPan(){
  const {w,h}=viewportSize();
  const cw=LAST.cw*V.zoom, ch=LAST.ch*V.zoom, m=140;
  V.panX=Math.min(w-m,Math.max(m-cw,V.panX));
  V.panY=Math.min(h-m,Math.max(m-ch,V.panY));
}
function focusIds(list){
  const ps=list.map(id=>LAST.pos[id]).filter(Boolean);
  if(!ps.length) return;
  const x1=Math.min(...ps.map(p=>p.x)), x2=Math.max(...ps.map(p=>p.x+CARDW));
  const y1=Math.min(...ps.map(p=>p.y)), y2=Math.max(...ps.map(p=>p.y+p.h));
  const {w,h}=viewportSize();
  V.zoom=Math.max(.35,Math.min(1.2,Math.min((w-70)/Math.max(1,x2-x1),(h-70)/Math.max(1,y2-y1))));
  centreOn((x1+x2)/2,(y1+y2)/2);
  render();
}
let LAST_REVEAL=[];
function focusRevealed(){focusIds(LAST_REVEAL);}

/* ---- minimap ---- */
const MM_W=168, MM_H=112;
function minimapHTML(L){
  const s=Math.min(MM_W/L.cw, MM_H/L.ch);
  const r=visibleRect();
  const nodes=LAST.ids.map(id=>{
    const p=L.pos[id]; if(!p) return "";
    const cls=id===P.anchor?"mm-a":(V.nodePos[id]?"mm-m":"mm-n");
    return `<i class="${cls}" style="left:${p.x*s}px;top:${p.y*s}px;width:${Math.max(2,CARDW*s)}px;height:${Math.max(1.5,p.h*s)}px"></i>`;
  }).join("");
  return `
  <div class="minimap" id="minimap" onmousedown="startMiniDrag(event)" title="Drag to move · click to jump">
    <div class="mm-inner" style="width:${L.cw*s}px;height:${L.ch*s}px">
      ${nodes}
      <div class="mm-vp" style="left:${r.x*s}px;top:${r.y*s}px;width:${Math.max(6,r.w*s)}px;height:${Math.max(6,r.h*s)}px"></div>
    </div>
    <span class="mm-label">${LAST.ids.length} shown</span>
  </div>`;
}
let mdrag=null;
function startMiniDrag(e){
  e.stopPropagation();
  const mm=document.getElementById("minimap"); if(!mm) return;
  const box=mm.getBoundingClientRect();
  const s=Math.min(MM_W/LAST.cw, MM_H/LAST.ch);
  mdrag={box,s};
  miniJump(e);
  e.preventDefault();
}
function miniJump(e){
  if(!mdrag) return;
  const cx=(e.clientX-mdrag.box.left-6)/mdrag.s;
  const cy=(e.clientY-mdrag.box.top-6)/mdrag.s;
  centreOn(cx,cy);clampPan();
  const c=document.getElementById("lin-canvas");
  if(c) c.style.transform=`translate(${V.panX}px,${V.panY}px) scale(${V.zoom})`;
  const vp=document.querySelector(".mm-vp");
  const r=visibleRect();
  if(vp){vp.style.left=(r.x*mdrag.s)+"px";vp.style.top=(r.y*mdrag.s)+"px";}
}
function onWheel(e){
  if(!e.ctrlKey&&!e.metaKey) return;   // plain wheel is left alone
  e.preventDefault();
  zoomBy(e.deltaY>0?-.1:.1);
}
function pathToAnchor(id){
  // shortest path in the undirected projected graph, anchor → id
  const prev={},q=[P.anchor],seen=new Set([P.anchor]);
  while(q.length){
    const n=q.shift(); if(n===id) break;
    [...(P.up[n]||[]),...(P.down[n]||[])].forEach(x=>{ if(!seen.has(x)){seen.add(x);prev[x]=n;q.push(x);} });
  }
  if(!seen.has(id)) return [id];
  const out=[];let c=id;while(c!==undefined){out.push(c);c=prev[c];}
  return out;
}
function fieldEdges(e,A,B){
  const fa=fieldsOf(e.a),fb=fieldsOf(e.b);
  const yTop=id=>{
    const n=P.nodes[id];let h=42;
    if(id===P.anchor)h+=14;
    if(tagCount(id))h+=13;
    const ov=overlayRows(id).length;if(ov)h+=5+ov*11;
    if(V.overlays.fields)h+=15;

  const rows=[];
  fb.forEach((f,j)=>{
    let i=fa.findIndex(x=>x.name===f.name);
    if(i<0 && j<fa.length && f.name!=="UPDATED_AT") i=j;
    if(i<0) return;
    const ga=FGEOM.get(e.a), gb=FGEOM.get(e.b);
    const y1=ga?A.y+ga.top+i*ga.rowH+ga.rowH/2:A.y+yTop(e.a)+i*15+7.5;
    const y2=gb?B.y+gb.top+j*gb.rowH+gb.rowH/2:B.y+yTop(e.b)+j*15+7.5;
    const x1=A.x+CARDW,x2=B.x,dx=Math.max(28,(x2-x1)/2);
    rows.push(`<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" stroke="${f.pii?"#e5007e":"#b9a6d8"}" stroke-width=".9"/>`);
  });

}
function cssId(id){return id.replace(/[^A-Za-z0-9_-]/g,"_");}

/* Field rows follow the same rule as the cards: in business mode the term is

   no term assigned show the column name in the unmapped style. */
/* Field rows use the same bar strip as the card header, in the same colours
   and order: PII, term (technical view), domain, policies, metrics. Each kind
   gets a fixed-width column sized to the busiest field on the card, so bars
   of one kind line up down the list. */
function fieldItems(f,k){

  if(k==="term")   return f.term?[{s:f.term,f:"Business term: "+f.term}]:[];
  if(k==="domain") return f.domain?[{s:f.domain,f:"Domain: "+f.domain}]:[];

}
function fieldCols(id){
  const o=V.overlays, fs=fieldsOf(id);

  if(o.domain) kinds.push("domain");
  if(o.policy) kinds.push("policy");
  if(o.metric) kinds.push("metric");
  return kinds.map(k=>({k,n:Math.min(DETAIL_MAX,Math.max(0,...fs.map(f=>fieldItems(f,k).length)))})).filter(c=>c.n>0);
}
function fieldBars(f,cols){

    if(rest.length) bars.push(`<span class="dbar more" style="${style}" title="${q(rest.map(r=>r.f).join(" · "))}"><span class="dl"><span class="dk">${name} +${rest.length} more</span> ${rest.map(r=>r.s).join(", ")}</span></span>`);
    if(bars.length) live=true;

function fieldRow(f,cols,id){

/* The business-layer repaint.
   It deliberately uses the SAME vertical budget as the technical card: the
   business term occupies the slot the technical name had, and the technical
   name/path drop to a ghosted monospace line inside that same slot. The rows
   below are a strict subset of the technical overlay rows, so cardH() is
   unchanged and nothing in the diagram moves when you flip the layer. */
function bizTitle(n){
  if(n.type==="Datasource") return n.domain;           // rolled-up nodes speak in domains

}
function bizBody(id,n,tags){
  const t=bizTitle(n);

    if(k==="metric") return `<div class="bmet" title="${(n.metrics||[]).join(" · ")}">◇ ${metricShort(n)}</div>`;
    if(k==="domain") return `<div class="ovrow"><span>Domain</span> ${n.domain}</div>`;
    if(k==="owner")  return `<div class="ovrow"><span>Steward</span> ${n.owner}</div>`;
    return "";
  }).filter(Boolean);
  // No term assigned: fall back to the technical name, styled as unmapped.
  // Shouting "No business term" on half the cards made the picture unreadable;
  // this keeps it calm while still being obviously different from a real term.
  const more=(n.terms||[]).length>1?`<span class="tmore">+${n.terms.length-1}</span>`:"";
  const head = t
    ? `<div class="bterm">${t}${termTick(t)}${more}</div><div class="ghost">${n.name||id}</div>`
    : `<div class="bterm unmapped">${n.name||id}</div><div class="ghost gh-un">no term assigned</div>`;

}
function card(id,p,visSet,isNew){
  if(!p) return "";

  const hu=hiddenNeighbours(id,"up",visSet), hd=hiddenNeighbours(id,"down",visSet);

function listRows(){
  project();
  const {ids,depth}=traverse();
  const rows=ids.map(id=>{
    const n=P.nodes[id],d=depth[id]??0;
    return {id,name:n.name||id,type:n.type,sys:n.sys,dir:d<0?"up":d>0?"down":"anchor",hops:Math.abs(d),
      owner:n.owner,dq:n.dq,gov:n.gov,cert:n.certified?"Certified":"—",
      term:bizTitle(n)||"— not assigned",pii:piiCountOf(id),policy:policyFull(n),
      metric:(n.metrics||[]).join(" · ")||"—"};
  });
  const {k,dir}=V.sort;
  rows.sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==="number"?x-y:String(x).localeCompare(String(y)))*dir;});
  return rows;
}
function listHTML(){

/* The view state summary. Two rules from Display Panel Req 7:
   AC4 — an element at its DEFAULT is not listed, so the strip stays short.
   AC6 — when nothing is active it occupies no vertical space at all.
   Styling is deliberately neutral: purple is the action colour in this UI, and
   this row is status, so colouring it purple made it compete with the controls. */
function chip(label,value,onClear,cat,detail,clearLabel){
  return {label,value,onClear,cat:cat||"view",detail:detail||"",clearLabel:clearLabel||"Clear"};

function viewChips(){
  const chips=[];
  if(V.up!==1||V.down!==1)
    chips.push(chip("Reach",`↑${V.up>=9?"All":V.up} ↓${V.down>=9?"All":V.down}`,"resetReach()","scope",
      `${V.up>=9?"All":V.up} hop${V.up===1?"":"s"} upstream and ${V.down>=9?"all":V.down} downstream of the anchor.`,"Reset"));
  if(Object.keys(V.branch).length){
    const n=Object.keys(V.branch).length;
    chips.push(chip("Expanded",`${n} branch${n>1?"es":""}`,"clearBranches()","scope","Opened one level at a time beyond the reach."));
  }
  if(V.grain!=="Dataset") chips.push(chip("Grain",V.grain,"setGrain('Dataset')","scope","Datasets are rolled up to the source they live in."));
  V.filters.forEach((f,i)=>chips.push(chip(f.k,`${f.op} ${f.v}`,`rmFilter(${i})`,"scope","Only matching assets are drawn. Gaps are bridged with dashed edges.")));
  if((V.pinned||[]).length) chips.push(chip("Revealed",`${V.pinned.length} out of scope`,"clearPinned()","scope","Pulled in to connect a search match to the anchor."));
  if(LAST.bridges.length) chips.push(chip("Bridged",`${LAST.bridges.length} edge${LAST.bridges.length>1?"s":""}`,"","scope","Dashed edges stand in for assets the filters hide."));
  if(biz()){
    const vis=LAST.ids.length?LAST.ids:[P.anchor];
    const noTerm=vis.filter(x=>P.nodes[x]&&!bizTitle(P.nodes[x])).length;
    chips.push(chip("Business context",noTerm?`${noTerm} without a term`:"On","setBizLayer(false)","context",
      "Cards lead with the business term; the technical name sits beneath it.","Turn off"));
  }
  if(!biz()) ["term","domain","policy","metric","owner","rel"].forEach(k=>{
    if(V.overlays[k]) chips.push(chip(OV_LABELS[k],"Shown on cards",`setOverlay('${k}',false)`,"context","Added to every card in the diagram.","Hide")); });
  if(V.render!=="graph") chips.push(chip("Render","List","setRender('graph')","view","The same assets as a sortable table.","Back to graph"));
  if(V.query) chips.push(chip(V.searchMode==="filter"?"Filtered to":"Highlighting",`“${V.query}”`,"onQuery('')","view",
    V.searchMode==="filter"?"Only matching assets are drawn.":"Matches stay bright; everything else dims."));
  if(Object.keys(V.nodePos).length) chips.push(chip("Hand-placed",`${Object.keys(V.nodePos).length} card${Object.keys(V.nodePos).length>1?"s":""}`,"tidy()","view","Moved by hand. Tidy re-runs the layout.","Tidy"));
  return chips;
}
